<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tag Filter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
.tag-filter {
  max-width: 1200px;
  margin: 40px auto;
  padding: 0 24px;
}

.tag-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

/* CHANGE THIS COLOR */
.tag-buttons button {
  background: #34D597; /* ← your color */
  color: #111;
  border: none;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
}

.tag-buttons button.active {
  background: #0d1b4c;
  color: #fff;
}
</style>
</head>

<body>

<section class="tag-filter">
  <div class="tag-buttons">
    <button data-tag="tech">Tech</button>
    <button data-tag="philosophy">Philosophy</button>
    <button data-tag="culture">Culture</button>
    <button data-tag="systems">Systems</button>
    <button data-tag="souldragon">Soul Dragon™</button>
  </div>
</section>

</body>
</html>
