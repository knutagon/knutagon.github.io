<!-- ══════════════════════════════════════

        <div class="dropdown">
          <a href="#">Overview</a>
          <a href="#">Latest Posts</a>
          <a href="#">Trending</a>
        </div>
      </div>
      <div class="nav-item"><a class="nav-link" href="#">Lifestyle</a></div>
      <div class="nav-item"><a class="nav-link" href="#">Culture</a></div>
      <div class="nav-item">
        <a class="nav-link" href="#">Features
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </a>
        <div class="dropdown">
          <a href="#">Long Reads</a>
          <a href="#">Interviews</a>
          <a href="#">Columns</a>
        </div>
      </div>
      <div class="nav-item">
        <a class="nav-link" href="#">Shop
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </a>

    <div class="header-controls">

<!-- ===== MOBILE SLIDE-IN DRAWER (replaces your dropdown) ===== -->
<div class="mobile-drawer" id="mobileDrawer">
  <div class="mobile-drawer-header">
    <span class="mobile-drawer-logo">Knutagon</span>
    <button class="close-menu" id="closeMenu" aria-label="Close menu">✕</button>
  </div>
  <nav class="mobile-nav">
    <a class="nav-link active" href="#">Home</a>
    <a class="nav-link" href="#">Lifestyle</a>
    <a class="nav-link" href="#">Culture</a>
    <a class="nav-link" href="#">Features</a>
    <a class="nav-link" href="#">Shop</a>
  </nav>
  <div class="mobile-controls">
    <a class="btn-cta" href="#" style="flex:1; text-align:center;">Free Newsletter</a>
    <button class="icon-btn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
    </button>
    <label class="theme-toggle" aria-label="Toggle dark mode">
      <input type="checkbox" id="themeToggleMobile" />
      <div class="toggle-track">
        <span class="t-icon sun">☀️</span>
        <span class="t-icon moon">🌙</span>
      </div>
      <div class="toggle-knob"></div>
    </label>
  </div>
</div>

<!-- ===== OVERLAY ===== -->
<div class="drawer-overlay" id="drawerOverlay"></div>

<style>
  /* KEEP YOUR EXISTING STYLES - Only add these new ones */

  /* ===== MOBILE DRAWER - Slide in ===== */
  .mobile-drawer {
    position: fixed;
    top: 0;
    right: -320px;
    width: 300px;
    max-width: 80vw;
    height: 100vh;
    background: var(--bg, #ffffff);
    box-shadow: 0 0 40px rgba(0,0,0,0.2);
    z-index: 9999;
    padding: 24px 24px 32px;
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .mobile-drawer.open {
    right: 0;
  }

  .mobile-drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border, #e8e8e8);
    margin-bottom: 20px;
  }

  .mobile-drawer-logo {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary, #1a1f2e);
  }

  .close-menu {
    background: none;
    border: none;
    font-size: 24px;
    color: var(--text-primary, #1a1f2e);
    cursor: pointer;
    padding: 4px 8px;
    transition: transform 0.2s;
  }

  .close-menu:hover {
    transform: rotate(90deg);
  }

  .mobile-nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }

  .mobile-nav .nav-link {
    padding: 12px 16px;
    font-size: 16px;
    border-radius: 10px;
  }

  .mobile-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 16px;
    border-top: 1px solid var(--border, #e8e8e8);
    margin-top: 8px;
  }

  .mobile-controls .btn-cta {
    flex: 1;
    justify-content: center;
  }

  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 9998;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .drawer-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  /* Hide old mobile drawer if you had one */
  .mobile-drawer:not(#mobileDrawer) {
    display: none !important;
  }

  [data-theme="dark"] .mobile-drawer {
    background: #1a1d27;
  }

  [data-theme="dark"] .mobile-drawer-logo {
    color: #f1f5f9;
  }

  [data-theme="dark"] .close-menu {
    color: #f1f5f9;
  }

  /* ===== RESPONSIVE - Keep your existing, just add these ===== */
  @media (max-width: 900px) {
    .main-nav { display: none; }
    .hamburger { display: flex; }
    .header-controls .btn-cta,
    .header-controls .icon-btn { display: none; }
    .header-controls .theme-toggle { display: inline-block; }
  }

  @media (max-width: 480px) {
    .header-inner { padding: 0 16px; gap: 12px; }
    .mobile-drawer { width: 280px; padding: 20px; }
  }
</style>

<script>
  (function() {
    const html = document.documentElement;
    const desktopToggle = document.getElementById('themeToggle');
    const mobileToggle = document.getElementById('themeToggleMobile');
    const hamburger = document.getElementById('hamburger');
    const closeMenu = document.getElementById('closeMenu');
    const drawer = document.getElementById('mobileDrawer');
    const overlay = document.getElementById('drawerOverlay');

    // ===== THEME - KEEP YOUR EXISTING LOGIC =====
    function setTheme(dark) {
      html.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (desktopToggle) desktopToggle.checked = dark;
      if (mobileToggle) mobileToggle.checked = dark;
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark') setTheme(true);

    if (desktopToggle) {
      desktopToggle.addEventListener('change', () => setTheme(desktopToggle.checked));
    }
    if (mobileToggle) {
      mobileToggle.addEventListener('change', () => setTheme(mobileToggle.checked));
    }

    // ===== DRAWER CONTROLS =====
    function openDrawer() {
      drawer.classList.add('open');
      overlay.classList.add('active');
      hamburger.classList.add('active');
      hamburger.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      overlay.classList.remove('active');
      hamburger.classList.remove('active');
      hamburger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    if (hamburger) {
      hamburger.addEventListener('click', () => {
        if (drawer.classList.contains('open')) {
          closeDrawer();
        } else {
          openDrawer();
        }
      });
    }

    if (closeMenu) closeMenu.addEventListener('click', closeDrawer);
    if (overlay) overlay.addEventListener('click', closeDrawer);

    // Close drawer when clicking a link
    drawer.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', closeDrawer);
    });

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && drawer.classList.contains('open')) {
        closeDrawer();
      }
    });
  })();
</script>
