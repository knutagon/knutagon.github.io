<style>
  .featured{ 
    border-bottom: 1px solid var(--line); 
    padding: 48px 0 80px; 
  }

  .featured-card{
    position: relative;
    border-radius: var(--radius-l);
    overflow: hidden;
    min-height: 560px;
    display: flex; 
    align-items: flex-end;
    background: var(--paper-alt);
  }

  .featured-card img{
    position:absolute; inset:0; 
    width:100%; height:100%; 
    object-fit:cover; 
    border-radius:0;
    transform: scale(1.04);
    transition: transform 1.2s var(--ease);
  }

  .featured-card:hover img{ transform: scale(1); }

  .featured-card::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(0deg, rgba(10,11,13,0.88) 0%, rgba(10,11,13,0.45) 45%, rgba(10,11,13,0.05) 75%);
  }

  .featured-content{ 
    position:relative; 
    z-index:2; 
    padding: 44px; 
    color:#F4F2EA; 
    max-width: 760px; 
  }

  .featured-content .tag{ 
    background: var(--signal); 
    color:#fff; 
    padding: 4px 10px;
    border-radius: var(--radius-s);
    font-size: 12px;
    font-family: var(--font-mono);
    text-transform: uppercase;
  }

  .featured-content .meta{ 
    color: rgba(244,242,234,0.75); 
    font-size: 12px;
    font-family: var(--font-mono);
    margin-top: 6px;
  }

  .featured-content h1{ 
    font-size: clamp(28px, 4.6vw, 48px); 
    line-height:1.08; 
    margin: 16px 0 14px; 
    font-weight: 800; 
  }

  .featured-content p{ 
    color: rgba(244,242,234,0.82); 
    font-size: 16px; 
    max-width: 560px; 
    margin-bottom: 22px; 
  }

  .featured-meta-row{ 
    display:flex; 
    align-items:center; 
    gap:14px; 
    margin-top: 6px; 
    flex-wrap:wrap; 
  }

  .featured-meta-row .btn-primary{ 
    background:#F4F2EA; 
    color:#16181C; 
    padding: 10px 18px;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 14px;
  }

  .featured-meta-row .btn-primary:hover{ 
    background: var(--signal); 
    color:#fff; 
  }

  .featured-skel{ height: 560px; }

  @media (max-width: 720px){
    .featured-card{ min-height: 420px; }
    .featured-content{ padding: 26px; }
  }
</style>

<section class="featured" id="featured">
  <div class="container">
    <div class="eyebrow reveal">Front Page</div>

    <!-- This is the container blog.js will populate -->
    <div class="featured-card reveal" id="featuredCard" data-loading="true">

      <!-- Skeleton fallback (visible until JS replaces it) -->
      <div class="featured-content">
        <div class="tag">Loading…</div>
        <h1>Loading featured story…</h1>
        <p>Please wait while the latest post loads.</p>
        <div class="featured-meta-row">
          <a class="btn-primary">Loading…</a>
        </div>
      </div>

    </div>
  </div>
</section>
