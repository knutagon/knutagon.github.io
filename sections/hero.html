<!-- ══════════════════════════════════════
     HERO
══════════════════════════════════════ -->
<section class="hero-section">
  <div class="hero-inner">

    <!-- FEATURED POST (Dynamically Injected) -->
    <a class="hero-featured" id="hero-featured-post" href="#">
      <img class="hero-featured-img" src="" alt="Featured post" />
      <div class="hero-featured-overlay"></div>
      <div class="hero-featured-content">
        <span class="hero-category" id="hero-category"></span>
        <h2 class="hero-title" id="hero-title"></h2>
        <p class="hero-meta"><span class="hero-author" id="hero-author"></span> <span class="hero-dot">·</span> <time id="hero-date"></time></p>
      </div>
    </a>

    <!-- SIDEBAR -->
    <div class="hero-sidebar">

      <!-- TABS -->
      <div class="hero-tabs" role="tablist">
        <button 
          class="hero-tab active" 
          data-tab="popular" 
          role="tab" 
          aria-selected="true"
          onclick="switchHeroTab('popular', this)"
        >
          Popular
        </button>
        <button 
          class="hero-tab mobile-hide-recent" 
          data-tab="recent" 
          role="tab" 
          aria-selected="false"
          onclick="switchHeroTab('recent', this)"
        >
          Recent
        </button>
      </div>

      <!-- POPULAR LIST -->
      <div class="hero-list active" id="tab-popular">
        <!-- Populated via JavaScript -->
      </div>

      <!-- RECENT LIST -->
      <div class="hero-list mobile-hide-recent" id="tab-recent">
        <!-- Populated via JavaScript -->
      </div>

    </div>
  </div>

  <!-- SCROLL ARROW -->
  <button class="hero-scroll-btn" aria-label="Scroll down" onclick="window.scrollBy({top: window.innerHeight, behavior: 'smooth'})">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M12 5v14M5 12l7 7 7-7"/>
    </svg>
  </button>
</section>

<script>
  // Master list of blog posts
  let blogPosts = [
    {
      id: 1,
      title: "How to Build a Morning Routine That Actually Works",
      category: "Inspiration",
      author: "Katen Doe",
      date: "July 10, 2026",
      timestamp: 1783728000,
      views: 1420,
      image: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=900&q=80",
      url: "#"
    },
    {
      id: 2,
      title: "The Future of AI in Everyday Life",
      category: "Technology",
      author: "Katen Doe",
      date: "July 9, 2026",
      timestamp: 1783641600,
      views: 3890,
      image: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=900&q=80",
      url: "#"
    },
    {
      id: 3,
      title: "Weekend Escapes: Hidden Gems Near the City",
      category: "Travel",
      author: "Katen Doe",
      date: "July 8, 2026",
      timestamp: 1783555200,
      views: 950,
      image: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900&q=80",
      url: "#"
    },
    {
      id: 4,
      title: "10 Recipes That Will Change Your Meal Prep Game",
      category: "Lifestyle",
      author: "Katen Doe",
      date: "July 7, 2026",
      timestamp: 1783468800,
      views: 2150,
      image: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=900&q=80",
      url: "#"
    },
    {
      id: 5,
      title: "What Can You Do About Fashion Right Now",
      category: "Fashion",
      author: "Katen Doe",
      date: "August 17, 2022",
      timestamp: 1660694400,
      views: 4100,
      image: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=120&q=70",
      url: "#"
    }
  ];

  function initHeroSection() {
    if (blogPosts.length === 0) return;

    // 1. FEATURED POST: Always automatically takes the absolute newest post
    const sortedByRecent = [...blogPosts].sort((a, b) => b.timestamp - a.timestamp);
    const featured = sortedByRecent[0];

    document.getElementById('hero-featured-post').href = featured.url;
    document.querySelector('.hero-featured-img').src = featured.image;
    document.getElementById('hero-category').textContent = featured.category;
    document.getElementById('hero-title').textContent = featured.title;
    document.getElementById('hero-author').textContent = featured.author;
    document.getElementById('hero-date').textContent = featured.date;

    // 2. RECENT TAB: Sorts chronologically (newest first), takes top 4
    const recentListHTML = sortedByRecent.slice(0, 4).map(post => `
      <a class="hero-post" href="${post.url}">
        <img src="${post.image}" alt="" />
        <div class="hero-post-info">
          <h3>${post.title}</h3>
          <time>${post.date}</time>
        </div>
      </a>
    `).join('');
    document.getElementById('tab-recent').innerHTML = recentListHTML;

    // 3. POPULAR TAB: Sorts by highest views, takes top 4
    const sortedByPopular = [...blogPosts].sort((a, b) => b.views - a.views);
    const popularListHTML = sortedByPopular.slice(0, 4).map(post => `
      <a class="hero-post" href="${post.url}">
        <img src="${post.image}" alt="" />
        <div class="hero-post-info">
          <h3>${post.title}</h3>
          <time>${post.date}</time>
        </div>
      </a>
    `).join('');
    document.getElementById('tab-popular').innerHTML = popularListHTML;
  }

  // Tab switching helper function
  function switchHeroTab(tabName, buttonElement) {
    const sidebar = buttonElement.closest('.hero-sidebar');
    
    sidebar.querySelectorAll('.hero-tab').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-selected', 'false');
    });
    
    sidebar.querySelectorAll('.hero-list').forEach(l => {
      l.classList.remove('active');
    });

    buttonElement.classList.add('active');
    buttonElement.setAttribute('aria-selected', 'true');
    sidebar.querySelector(`#tab-${tabName}`).classList.add('active');
  }

  // Run on page load
  document.addEventListener('DOMContentLoaded', initHeroSection);
</script>

<style>
  .hero-section {
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 32px 56px;
    position: relative;
    box-sizing: border-box;
    width: 100%;
  }

  .hero-inner {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 32px;
    align-items: stretch;
    width: 100%;
  }

  /* ── FEATURED ── */
  .hero-featured {
    position: relative;
    display: block;
    border-radius: 6px;
    overflow: hidden;
    text-decoration: none;
    min-height: 450px;
    background: #1a1d27;
    width: 100%;
    box-sizing: border-box;
  }

  .hero-featured-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .hero-featured:hover .hero-featured-img {
    transform: scale(1.03);
  }

  .hero-featured-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      transparent 30%,
      rgba(0,0,0,0.35) 60%,
      rgba(0,0,0,0.78) 100%
    );
    z-index: 1;
  }

  .hero-featured-content {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 32px;
    box-sizing: border-box;
    z-index: 2;
  }

  .hero-category {
    display: inline-block;
    padding: 5px 14px;
    background: linear-gradient(135deg, #f87171, #f97316);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    border-radius: 999px;
    margin-bottom: 12px;
  }

  .hero-title {
    font-size: clamp(22px, 2.5vw, 32px);
    font-weight: 700;
    color: #ffffff;
    line-height: 1.3;
    margin: 0 0 12px 0;
  }

  .hero-meta {
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .hero-dot { opacity: 0.5; }

  /* ── SIDEBAR ── */
  .hero-sidebar {
    display: flex;
    flex-direction: column;
    gap: 0;
    min-width: 0;
  }

  /* TABS */
  .hero-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    border-bottom: 2px solid var(--border, #e8e8e8);
  }

  .hero-tab {
    padding: 8px 20px;
    font-size: 15px;
    font-weight: 600;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    cursor: pointer;
    color: var(--text-secondary, #6b7280);
    transition: color 0.2s, border-color 0.2s;
  }

  .hero-tab.active {
    color: var(--purple, #7c3aed);
    border-bottom-color: var(--purple, #7c3aed);
  }

  /* LIST DISPLAY SETTINGS */
  .hero-list {
    display: none;
    flex-direction: column;
    gap: 0;
  }

  .hero-list.active {
    display: flex !important;
  }

  .hero-post {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border, #e8e8e8);
    text-decoration: none;
    transition: opacity 0.2s;
    min-width: 0;
  }

  .hero-post:last-child { border-bottom: none; }
  .hero-post:hover { opacity: 0.75; }

  .hero-post img {
    width: 64px;
    height: 64px;
    border-radius: 5px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .hero-post-info { 
    display: flex; 
    flex-direction: column; 
    gap: 5px; 
    min-width: 0;
  }

  .hero-post-info h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary, #1a1f2e);
    line-height: 1.4;
    margin: 0;
    word-break: break-word;
  }

  .hero-post-info time {
    font-size: 12px;
    color: var(--text-secondary, #6b7280);
  }

  /* ── SCROLL BUTTON ── */
  .hero-scroll-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--border, #e8e8e8);
    background: var(--surface, #ffffff);
    color: var(--text-secondary, #6b7280);
    cursor: pointer;
    margin: 24px auto 0;
    transition: border-color 0.2s, color 0.2s, transform 0.2s;
    animation: hero-bounce 2s ease-in-out infinite;
  }

  .hero-scroll-btn svg { width: 18px; height: 18px; }

  @keyframes hero-bounce {
    0%, 100% { transform: translateY(0); }
    50%        { transform: translateY(5px); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .hero-section {
      padding: 24px 20px;
    }
    .hero-inner {
      grid-template-columns: 1fr;
      gap: 32px;
    }
    .hero-featured {
      min-height: unset;
      aspect-ratio: 16 / 10;
    }
    .mobile-hide-recent {
      display: none !important;
    }
  }

  @media (max-width: 480px) {
    .hero-section {
      padding: 16px 12px 32px;
    }
    .hero-featured {
      aspect-ratio: 4 / 3;
    }
    .hero-featured-content {
      padding: 20px 16px;
    }
    .hero-title {
      font-size: 20px;
    }
  }
</style>
