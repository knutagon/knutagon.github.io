<!-- ══════════════════════════════════════
     HERO (Full Width Latest Post)
══════════════════════════════════════ -->
<section class="hero-section">
  <div class="hero-inner">
    <div id="latest"></div>
  </div>

  <!-- SCROLL ARROW -->
  <button class="hero-scroll-btn" aria-label="Scroll down" onclick="window.scrollBy({top: window.innerHeight, behavior: 'smooth'})">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M12 5v14M5 12l7 7 7-7"/>
    </svg>
  </button>
</section>

<script>
  async function loadSection(elementId, file) {
    try {
      const response = await fetch(`sections/${file}`);
      if (response.ok) {
        const html = await response.text();
        document.getElementById(elementId).innerHTML = html;
      } else {
        console.error(`Failed to load sections/${file}`);
      }
    } catch (error) {
      console.error(`Error loading sections/${file}:`, error);
    }
  }

  loadSection('latest', 'latest.html');
</script>

<style>
  .hero-section {
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 32px 56px;
    position: relative;
    box-sizing: border-box;
    width: 100%;
  }

  .hero-inner {
    width: 100%;
  }

  .hero-featured {
    position: relative;
    display: block;
    border-radius: 6px;
    overflow: hidden;
    text-decoration: none;
    min-height: 480px;
    background: #1a1d27;
    width: 100%;
    box-sizing: border-box;
  }

  .hero-featured-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .hero-featured:hover .hero-featured-img {
    transform: scale(1.03);
  }

  .hero-featured-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      transparent 30%,
      rgba(0,0,0,0.35) 60%,
      rgba(0,0,0,0.78) 100%
    );
    z-index: 1;
  }

  .hero-featured-content {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 40px;
    box-sizing: border-box;
    z-index: 2;
  }

  .hero-category {
    display: inline-block;
    padding: 5px 14px;
    background: linear-gradient(135deg, #f87171, #f97316);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    border-radius: 999px;
    margin-bottom: 12px;
  }

  .hero-title {
    font-size: clamp(24px, 3vw, 36px);
    font-weight: 700;
    color: #ffffff;
    line-height: 1.3;
    margin: 0 0 12px 0;
  }

  .hero-meta {
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .hero-dot { opacity: 0.5; }

  .hero-scroll-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--border, #e8e8e8);
    background: var(--surface, #ffffff);
    color: var(--text-secondary, #6b7280);
    cursor: pointer;
    margin: 24px auto 0;
    transition: border-color 0.2s, color 0.2s, transform 0.2s;
    animation: hero-bounce 2s ease-in-out infinite;
  }

  .hero-scroll-btn svg { width: 18px; height: 18px; }

  @keyframes hero-bounce {
    0%, 100% { transform: translateY(0); }
    50%        { transform: translateY(5px); }
  }

  @media (max-width: 900px) {
    .hero-section { padding: 24px 20px; }
    .hero-featured { min-height: unset; aspect-ratio: 16 / 9; }
  }

  @media (max-width: 480px) {
    .hero-section { padding: 16px 12px 32px; }
    .hero-featured { aspect-ratio: 4 / 3; }
    .hero-featured-content { padding: 20px 16px; }
    .hero-title { font-size: 20px; }
  }
</style>
