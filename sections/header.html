<style>
  /* ============================
     HEADER WRAPPER + STICKY LOGIC
     Controls sticky behavior, blur, border, shadow
     ============================ */
  .site-header{
    position: sticky; top: 0; z-index: 900; /* Sticks to top of page */
    background: rgba(247,245,239,0.86);     /* Light translucent background */
    backdrop-filter: blur(10px) saturate(1.4); /* Glassy blur effect */
    -webkit-backdrop-filter: blur(10px) saturate(1.4);
    border-bottom: 1px solid transparent;   /* Border appears when stuck */
    transition: border-color var(--dur) var(--ease),
                background var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease); /* Smooth transitions */
  }

  /* Dark mode header background */
  [data-theme="dark"] .site-header{
    background: rgba(16,18,21,0.82);
  }

  /* Header when scrolled past threshold */
  .site-header.is-stuck{
    border-color: var(--line); /* Visible border */
    box-shadow: 0 2px 16px rgba(22,24,28,0.06); /* Drop shadow */
  }

  /* ============================
     HEADER INNER LAYOUT 
     Controls spacing + alignment of header content
     ============================ */
  .header-inner{
    display:flex;
    align-items:center;
    gap:28px;
    height: var(--header-h); /* Header height variable */
  }

  /* ============================
     LOGO
     Controls logo text + dot styling
     ============================ */
  .logo{
    display:flex;
    align-items:center;
    gap:9px;
    font-family: var(--font-display);
    font-weight:800;
    font-size: 21px;
    margin-right: 6px;
    flex-shrink:0;
  }

  .logo .dot{
    width:9px; height:9px;
    background: var(--signal); /* Red dot */
    border-radius: 50%;
    display:inline-block;
  }

  /* ============================
     PRIMARY NAVIGATION
     Controls top-level nav links
     ============================ */
  .primary-nav{
    display:flex;
    align-items:center;
    gap:26px;
    flex:1; /* Pushes nav to fill space */
  }

  .primary-nav a{
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft); /* Soft gray */
    padding: 6px 2px;
    position:relative;
    transition: color var(--dur);
  }

  .primary-nav a:hover{
    color: var(--ink); /* Darker on hover */
  }

  /* Underline animation */
  .primary-nav a::after{
    content:"";
    position:absolute;
    left:0; bottom:-3px;
    width:0; height:2px;
    background:var(--accent);
    transition: width var(--dur) var(--ease);
  }
  .primary-nav a:hover::after{
    width:100%;
  }

  /* ============================
     DROPDOWN MENU
     Controls "More" dropdown
     ============================ */
  .nav-dropdown{ position:relative; }

  .nav-dropdown > button{
    background:none; border:none;
    font: inherit;
    font-size:14px; font-weight:600;
    color: var(--ink-soft);
    display:flex; align-items:center; gap:5px;
    padding:6px 2px;
  }

  .nav-dropdown > button:hover{
    color: var(--ink);
  }

  /* Dropdown arrow rotation */
  .nav-dropdown svg{
    width:11px;
    transition: transform var(--dur);
  }
  .nav-dropdown:hover svg,
  .nav-dropdown.open svg{
    transform: rotate(180deg);
  }

  /* Dropdown menu container */
  .dropdown-menu{
    position:absolute; top: calc(100% + 14px); left: -14px;
    background: var(--card);
    border:1px solid var(--line);
    border-radius: var(--radius);
    min-width: 190px;
    padding: 8px;
    box-shadow: var(--shadow-l);
    opacity:0; visibility:hidden;
    transform: translateY(6px);
    transition: opacity var(--dur) var(--ease),
                transform var(--dur) var(--ease),
                visibility var(--dur);
  }

  /* Dropdown visible */
  .nav-dropdown:hover .dropdown-menu,
  .nav-dropdown.open .dropdown-menu{
    opacity:1; visibility:visible;
    transform: translateY(0);
  }

  /* Dropdown links */
  .dropdown-menu a{
    display:block;
    padding: 9px 10px;
    font-size: 13.5px;
    font-weight:500;
    border-radius: var(--radius-s);
    color: var(--ink-soft);
  }

  .dropdown-menu a:hover{
    background: var(--paper-alt);
    color: var(--ink);
  }

  /* ============================
     HEADER ACTIONS
     Search button, CTA button, theme toggle
     ============================ */
  .header-actions{
    display:flex;
    align-items:center;
    gap:14px;
    flex-shrink:0;
  }

  /* Icon buttons (search, hamburger) */
  .icon-btn{
    background:none; border:none;
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink);
    border-radius: var(--radius);
    transition: background var(--dur);
  }

  .icon-btn:hover{
    background: var(--paper-alt);
  }

  .icon-btn svg{
    width:18px; height:18px;
  }

  /* ============================
     THEME TOGGLE SWITCH
     ============================ */
  .theme-toggle{
    position:relative;
    width:52px; height:28px;
    border-radius: 20px;
    background: var(--paper-alt);
    border:1px solid var(--line-strong);
    flex-shrink:0;
  }

  .theme-toggle .knob{
    position:absolute; top:2px; left:2px;
    width:22px; height:22px;
    border-radius:50%;
    background: var(--ink);
    display:flex; align-items:center; justify-content:center;
    color: var(--paper);
    transition: transform var(--dur) var(--ease);
  }

  /* Knob moves right in dark mode */
  [data-theme="dark"] .theme-toggle .knob{
    transform: translateX(24px);
    background: var(--accent);
  }

  .theme-toggle .knob svg{
    width:13px; height:13px;
  }

  /* ============================
     MOBILE NAVIGATION
     ============================ */
  .hamburger{ display:none; }

  @media (max-width: 980px){
    .primary-nav,
    .nav-dropdown,
    .header-actions .btn-primary{
      display:none; /* Hide desktop nav */
    }

    .hamburger{
      display:flex;
      align-items:center; justify-content:center;
      width:38px; height:38px;
      background:none; border:none;
      order:-1;
    }

    .hamburger svg{ width:22px; }

    .header-inner{ gap: 10px; }
  }

  /* ============================
     MOBILE SLIDE-IN MENU
     ============================ */
  .mobile-menu-scrim{
    position:fixed; inset:0;
    background: rgba(16,18,21,0.5);
    z-index: 1100;
    opacity:0; visibility:hidden;
    transition: opacity var(--dur) var(--ease),
                visibility var(--dur);
  }

  .mobile-menu-scrim.open{
    opacity:1; visibility:visible;
  }

  .mobile-menu{
    position:fixed; top:0; right:0; bottom:0;
    width: min(320px, 84vw);
    background: var(--card);
    z-index:1200;
    padding: 20px;
    transform: translateX(100%); /* Hidden off-screen */
    transition: transform 380ms var(--ease);
    display:flex; flex-direction:column; gap: 22px;
    box-shadow: -12px 0 40px rgba(0,0,0,0.18);
  }

  .mobile-menu.open{
    transform: translateX(0); /* Slide in */
  }

  .mobile-menu-top{
    display:flex; align-items:center; justify-content:space-between;
  }

  .mobile-menu-close{
    background: var(--paper-alt);
    border:none;
    width:34px; height:34px;
    border-radius: var(--radius);
    display:flex; align-items:center; justify-content:center;
  }

  .mobile-menu-close svg{ width:16px; }

  .mobile-menu nav{
    display:flex; flex-direction:column;
  }

  .mobile-menu nav a{
    padding: 14px 2px;
    font-size: 17px;
    font-weight:600;
    border-bottom: 1px solid var(--line);
    font-family: var(--font-display);
  }

  .mobile-menu .btn{ width:100%; }

  /* ============================
     SEARCH OVERLAY
     Fullscreen search modal
     ============================ */
  .search-overlay{
    position: fixed; inset:0;
    background: rgba(16,18,21,0.5);
    backdrop-filter: blur(2px);
    z-index: 1000;
    display:flex;
    align-items:flex-start; justify-content:center;
    padding-top: 12vh;
    opacity:0; visibility:hidden;
    transition: opacity var(--dur) var(--ease),
                visibility var(--dur);
  }

  .search-overlay.open{
    opacity:1; visibility:visible;
  }

  .search-box{
    width: min(560px, 90vw);
    background: var(--card);
    border-radius: var(--radius-l);
    box-shadow: var(--shadow-l);
    overflow:hidden;
    transform: translateY(-14px);
    transition: transform var(--dur) var(--ease);
    border: 1px solid var(--line);
  }

  .search-overlay.open .search-box{
    transform: translateY(0);
  }

  .search-field{
    display:flex; align-items:center; gap:12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
  }

  .search-field svg{
    width:18px; height:18px;
    color: var(--ink-faint);
    flex-shrink:0;
  }

  .search-field input{
    flex:1;
    border:none; background:none; outline:none;
    font-size: 16px;
    font-family: var(--font-body);
    color: var(--ink);
  }

  .search-field input::placeholder{
    color: var(--ink-faint);
  }

  .search-close{
    background:none; border:none;
    color: var(--ink-faint);
    width:26px; height:26px;
  }

  .search-results{
    max-height: 46vh;
    overflow-y:auto;
    padding: 8px;
  }

  .search-results a{
    display:flex; align-items:center; gap:12px;
    padding: 10px;
    border-radius: var(--radius);
  }

  .search-results a:hover,
  .search-results a.active{
    background: var(--paper-alt);
  }

  .search-results img{
    width:46px; height:46px;
    object-fit:cover;
    flex-shrink:0;
  }

  .search-results .sr-title{
    font-size:13.5px;
    font-weight:600;
    line-height:1.3;
  }

  .search-results .sr-meta{
    font-family: var(--font-mono);
    font-size:10.5px;
    color: var(--ink-faint);
    margin-top:3px;
    text-transform:uppercase;
  }

  .search-empty{
    padding: 22px 16px;
    text-align:center;
    color: var(--ink-faint);
    font-size: 13.5px;
  }
</style>

<header class="site-header" id="siteHeader">
  <div class="container header-inner">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">

    <a href="#" class="logo"><span class="dot"></span>THE&nbsp;WIRE</a>

    <nav class="primary-nav" aria-label="Primary">
      <a href="#featured">Latest</a>

      <a href="#video">Watch</a>

      <div class="nav-dropdown" id="navDropdown">
        <button aria-haspopup="true" aria-expanded="false">

            <path d="M1 1l5 5 5-5"/>

        </button>

        <div class="dropdown-menu">
          <a href="#about">About The Wire</a>
          <a href="#testimonials">Reader Voices</a>
          <a href="#cta">Newsletter</a>
          <a href="#">Advertise</a>
          <a href="#">Careers</a>
        </div>
      </div>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" id="searchOpenBtn" aria-label="Search articles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>

      <a href="#cta" class="btn btn-primary">Subscribe</a>

      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span class="knob">

      </button>
    </div>
  </div>
</header>

<!-- Mobile slide-in menu -->

  <div class="mobile-menu-top">
    <a href="#" class="logo"><span class="dot"></span>THE&nbsp;WIRE</a>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="4" x2="20" y2="20"/>
        <line x1="20" y1="4" x2="4" y2="20"/>

  <nav>
    <a href="#featured">Latest</a>
    <a href="#categories">Categories</a>

    <a href="#about">About The Wire</a>

  </nav>
  <a href="#cta" class="btn btn-primary">Subscribe</a>
</aside>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">

</div>
