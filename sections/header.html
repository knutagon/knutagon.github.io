<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --border: #e8e8e8;
    --text-primary: #1a1f2e;
    --text-secondary: #6b7280;
    --teal: #0d9488;
    --teal-bg: rgba(13,148,136,0.1);
    --purple: #7c3aed;
    --purple-hover: #6d28d9;
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
    --radius: 999px;
    --toggle-bg: #e2e8f0;
    --toggle-knob: #ffffff;
    --nav-hover-text: #0d9488;
  }

  [data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --teal: #2dd4bf;
    --teal-bg: rgba(45,212,191,0.12);
    --shadow: 0 2px 24px rgba(0,0,0,0.4);
    --toggle-bg: #334155;
    --toggle-knob: #f1f5f9;
    --nav-hover-text: #2dd4bf;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .site-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    z-index: 1000;
  }

  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px;
    height: 68px;
    display: flex;
    align-items: center;
    gap: 40px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
  }

  .logo-mark {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, var(--teal), var(--purple));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #fff;
  }

  .logo-text { font-size: 20px; font-weight: 700; color: var(--text-primary); }
  .logo-dot { color: var(--teal); }

  .main-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
  }

  .nav-item { position: relative; }

  .nav-link {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 7px 14px;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
  }

  .nav-link:hover,
  .nav-link.active {
    color: var(--nav-hover-text);
    background: var(--teal-bg);
  }

  .chevron {
    width: 14px;
    height: 14px;
    opacity: 0.6;
    transition: transform 0.2s;
  }

  .nav-item:hover .chevron { transform: rotate(180deg); }

  .dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    min-width: 160px;
    box-shadow: var(--shadow);
  }

  .nav-item:hover .dropdown { display: block; }

  .dropdown a {
    display: block;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-secondary);
  }

  .dropdown a:hover {
    color: var(--nav-hover-text);
    background: var(--teal-bg);
  }

  .btn-cta {
    padding: 9px 20px;
    background: var(--purple);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    border-radius: var(--radius);
    text-decoration: none;
    transition: background 0.2s, transform 0.15s;
  }

  .btn-cta:hover {
    background: var(--purple-hover);
    transform: translateY(-1px);
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--teal-bg);
    color: var(--teal);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s;
  }

  .icon-btn:hover {
    background: var(--teal);
    color: #fff;
    transform: scale(1.05);
  }

  .icon-btn svg { width: 17px; height: 17px; }

  .theme-toggle {
    position: relative;
    width: 52px;
    height: 28px;
  }

  .theme-toggle input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--toggle-bg);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }

  .toggle-knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    background: var(--toggle-knob);
    border-radius: 50%;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  input:checked ~ .toggle-knob {
    transform: translateX(24px);
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
  }

  .hamburger span {
    width: 22px;
    height: 2px;
    background: var(--text-primary);
    border-radius: 2px;
  }

  .mobile-drawer {
    display: none;
    position: fixed;
    top: 68px;
    left: 0; right: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px 24px;
    box-shadow: var(--shadow);
    flex-direction: column;
    gap: 4px;
    z-index: 999;
  }

  .mobile-drawer.open { display: flex; }

  .mobile-drawer .nav-link {
    justify-content: space-between;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 16px;
  }

  .mobile-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px 4px;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }

  @media (max-width: 900px) {
    .main-nav { display: none; }
    .hamburger { display: flex; }
    .header-controls .btn-cta,
    .header-controls .icon-btn,
    .header-controls .theme-toggle { display: none; }
  }

  @media (max-width: 480px) {
    .header-inner { padding: 0 16px; gap: 12px; }
  }
</style>

<script>
  const html = document.documentElement;
  const desktopToggle = document.getElementById('themeToggle');
  const mobileToggle = document.getElementById('themeToggleMobile');
  const hamburger = document.getElementById('hamburger');
  const drawer = document.getElementById('mobileDrawer');

  function setTheme(dark) {
    html.setAttribute('data-theme', dark ? 'dark' : 'light');
    desktopToggle.checked = dark;
    mobileToggle.checked = dark;
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  }

  const saved = localStorage.getItem('theme');
  if (saved === 'dark') setTheme(true);

  desktopToggle.addEventListener('change', () => setTheme(desktopToggle.checked));
  mobileToggle.addEventListener('change', () => setTheme(mobileToggle.checked));

  hamburger.addEventListener('click', () => {
    const open = drawer.classList.toggle('open');
    hamburger.setAttribute('aria-expanded', open);
    drawer.setAttribute('aria-hidden', !open);
  });

  drawer.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', () => {
      drawer.classList.remove('open');
      hamburger.setAttribute('aria-expanded', false);
      drawer.setAttribute('aria-hidden', true);
    });
  });
</script>
