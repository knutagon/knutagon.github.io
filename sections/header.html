<style>
  /* ── TOKENS ─────────────────────────────── */
  :root {
    --surface:          #ffffff;
    --surface-glass:    rgba(255,255,255,0.85);
    --border:           rgba(0,0,0,0.08);
    --border-strong:    rgba(0,0,0,0.14);
    --text-primary:     #0f1117;
    --text-secondary:   #5a6072;
    --text-faint:       #9399a8;
    --teal:             #0d9488;
    --teal-light:       rgba(13,148,136,0.09);
    --teal-mid:         rgba(13,148,136,0.18);
    --purple:           #6d28d9;
    --purple-hover:     #5b21b6;
    --purple-light:     rgba(109,40,217,0.08);
    --shadow-sm:        0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:        0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
    --radius-pill:      999px;
    --radius-md:        12px;
    --radius-sm:        8px;
    --toggle-bg:        #e2e8f0;
    --toggle-knob:      #ffffff;
    --header-h:         64px;
    --drawer-w:         300px;
  }

  [data-theme="dark"] {
    --surface:          #0f1117;
    --surface-glass:    rgba(15,17,23,0.88);
    --border:           rgba(255,255,255,0.07);
    --border-strong:    rgba(255,255,255,0.12);
    --text-primary:     #f0f4ff;
    --text-secondary:   #8892a4;
    --text-faint:       #555e72;
    --teal:             #2dd4bf;
    --teal-light:       rgba(45,212,191,0.08);
    --teal-mid:         rgba(45,212,191,0.16);
    --purple:           #a78bfa;
    --purple-hover:     #c4b5fd;
    --purple-light:     rgba(167,139,250,0.1);
    --shadow-sm:        0 1px 3px rgba(0,0,0,0.3);
    --shadow-md:        0 4px 24px rgba(0,0,0,0.4);
    --toggle-bg:        #6d28d9;
    --toggle-knob:      #f0f4ff;
  }

  /* ── HEADER ─────────────────────────────── */
  .site-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    z-index: 2000;
    background: var(--surface-glass);
    backdrop-filter: blur(16px) saturate(1.6);
    -webkit-backdrop-filter: blur(16px) saturate(1.6);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
    /* GPU layer — prevents scroll repaint glitch */
    transform: translateZ(0);
    will-change: transform;
    contain: layout style;
  }

  .site-header.scrolled {
    box-shadow: var(--shadow-md);
    border-color: var(--border-strong);
  }

  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 28px;
  }

  /* ── LOGO ───────────────────────────────── */
  .logo {
    display: flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    flex-shrink: 0;
  }

  .logo-mark {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, var(--teal) 0%, var(--purple) 100%);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(109,40,217,0.28);
  }

  .logo-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.5px;
  }

  .logo-dot { color: var(--teal); }

  /* ── NAV ────────────────────────────────── */
  .main-nav {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 1;
  }

  .nav-item { position: relative; }

  .nav-link {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 13px;
    border-radius: var(--radius-pill);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    background: transparent;
    border: none;
    font-family: inherit;
    transition: color 0.18s, background 0.18s;
  }

  .nav-link:hover,
  .nav-link.active {
    color: var(--teal);
    background: var(--teal-light);
  }

  .chevron {
    width: 13px; height: 13px;
    opacity: 0.5;
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .nav-item:hover .chevron { transform: rotate(180deg); }

  /* ── DROPDOWN ───────────────────────────── */
  .dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: 6px;
    min-width: 168px;
    box-shadow: var(--shadow-md);
    z-index: 100;
  }

  .nav-item:hover .dropdown { display: block; }

  .dropdown a {
    display: block;
    padding: 8px 11px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.18s, background 0.18s;
  }

  .dropdown a:hover {
    color: var(--teal);
    background: var(--teal-light);
  }

  /* ── CONTROLS ───────────────────────────── */
  .header-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .btn-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 18px;
    background: var(--purple);
    color: #ffffff;
    font-size: 13.5px;
    font-weight: 600;
    border-radius: var(--radius-pill);
    border: none;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    font-family: inherit;
    letter-spacing: 0.01em;
    transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
    box-shadow: 0 2px 8px rgba(109,40,217,0.22);
  }

  .btn-cta:hover {
    background: var(--purple-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(109,40,217,0.32);
  }

  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--teal-light);
    color: var(--teal);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.18s, transform 0.15s;
  }

  .icon-btn:hover {
    background: var(--teal-mid);
    transform: scale(1.06);
  }

  .icon-btn svg { width: 16px; height: 16px; }

  /* ── THEME TOGGLE ───────────────────────── */
  .theme-toggle {
    position: relative;
    display: inline-block;
    width: 50px; height: 26px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .theme-toggle input {
    position: absolute;
    opacity: 0; width: 0; height: 0;
  }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--toggle-bg);
    border-radius: var(--radius-pill);
    transition: background 0.3s;
    overflow: hidden;
  }

  .t-icon {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    line-height: 1;
    pointer-events: none;
  }

  .t-icon.sun { left: 5px; }
  .t-icon.moon { right: 4px; }

  .toggle-knob {
    position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    background: var(--toggle-knob);
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.22);
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 2;
    pointer-events: none;
  }

  .theme-toggle input:checked ~ .toggle-knob {
    transform: translateX(24px);
  }

  /* ── HAMBURGER ──────────────────────────── */
  .hamburger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    background: none;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    cursor: pointer;
    padding: 7px 8px;
    flex-shrink: 0;
    z-index: 2100;
    transition: background 0.18s, border-color 0.18s;
  }

  .hamburger:hover {
    background: var(--teal-light);
    border-color: var(--teal);
  }

  .hamburger span {
    display: block;
    width: 20px; height: 2px;
    background: var(--text-primary);
    border-radius: 2px;
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1), opacity 0.2s;
  }

  body.menu-active .hamburger span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  body.menu-active .hamburger span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  body.menu-active .hamburger span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* ── MOBILE DRAWER ──────────────────────── */
  .mobile-drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: var(--drawer-w);
    background: var(--surface);
    border-left: 1px solid var(--border-strong);
    box-shadow: -8px 0 40px rgba(0,0,0,0.12);
    z-index: 1800;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 0;
    box-sizing: border-box;

    /* GPU-accelerated — no scroll glitch */
    transform: translate3d(100%, 0, 0);
    will-change: transform;
    transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body.menu-active .mobile-drawer {
    transform: translate3d(0, 0, 0);
  }

  .drawer-close {
    align-self: flex-end;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px; height: 34px;
    background: var(--teal-light);
    border: none;
    border-radius: var(--radius-sm);
    color: var(--teal);
    cursor: pointer;
    margin-bottom: 16px;
    flex-shrink: 0;
    transition: background 0.18s, transform 0.15s;
  }

  .drawer-close:hover {
    background: var(--teal-mid);
    transform: scale(1.06);
  }

  .drawer-content-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: env(safe-area-inset-bottom, 24px);
  }

  .drawer-nav-links {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .mobile-drawer .nav-link {
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 500;
    width: 100%;
    box-sizing: border-box;
    border-bottom: 1px solid var(--border);
  }

  .mobile-drawer .nav-link:last-child {
    border-bottom: none;
  }

  .mobile-controls {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px 0 8px;
    border-top: 1px solid var(--border-strong);
    margin-top: 16px;
  }

  .mobile-controls .btn-cta {
    width: 100%;
    padding: 13px;
    box-sizing: border-box;
    font-size: 14px;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  /* ── SCROLL EFFECT ──────────────────────── */
  /* Injected via JS below */

  /* ── RESPONSIVE ─────────────────────────── */
  @media (max-width: 900px) {
    .main-nav { display: none; }
    .hamburger { display: flex; }
    .header-controls .btn-cta,
    .header-controls .icon-btn,
    .header-controls .theme-toggle { display: none; }
  }

  @media (max-width: 480px) {
    .header-inner { padding: 0 16px; gap: 10px; }
    .mobile-drawer { width: min(var(--drawer-w), 88vw); }
  }
</style>

<script>
  /* Scroll shadow effect — lightweight, no layout thrash */
  (function () {
    const header = document.querySelector('.site-header');
    if (!header) return;
    const onScroll = () => {
      header.classList.toggle('scrolled', window.scrollY > 8);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();
</script>
