<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --border: #e8e8e8;
    --text-primary: #1a1f2e;
    --text-secondary: #6b7280;
    --teal: #0d9488;
    --teal-bg: rgba(13,148,136,0.1);
    --purple: #7c3aed;
    --purple-hover: #6d28d9;
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
    --radius: 999px;
    --toggle-bg: #e2e8f0;
    --toggle-knob-color: #ffffff;
    --nav-hover-text: #0d9488;
  }

  [data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --teal: #2dd4bf;
    --teal-bg: rgba(45,212,191,0.12);
    --shadow: 0 2px 24px rgba(0,0,0,0.4);
    --toggle-bg: #7c3aed;
    --toggle-knob-color: #f1f5f9;
    --nav-hover-text: #2dd4bf;
  }

  .site-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    transition: background 0.3s, border-color 0.3s;
  }

  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px;
    height: 68px;
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    flex-shrink: 0;
    min-width: 160px;
  }

  .logo-mark {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--teal) 0%, var(--purple) 100%);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    flex-shrink: 0;
  }

  .logo-text {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.4px;
    white-space: nowrap;
  }

  .logo-dot { color: var(--teal); }

  .main-nav {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 1;
  }

  .nav-item { position: relative; }

  .nav-link {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 7px 14px;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    background: transparent;
    border: none;
    transition: color 0.2s, background 0.2s;
  }

  .nav-link:hover,
  .nav-link.active {
    color: var(--nav-hover-text);
    background: var(--teal-bg);
  }

  .chevron {
    width: 14px;
    height: 14px;
    opacity: 0.6;
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .nav-item:hover .chevron { transform: rotate(180deg); }

  .dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    min-width: 160px;
    box-shadow: var(--shadow);
    z-index: 100;
  }

  .nav-item:hover .dropdown { display: block; }

  .dropdown a {
    display: block;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s, background 0.2s;
  }

  .dropdown a:hover {
    color: var(--nav-hover-text);
    background: var(--teal-bg);
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .btn-cta {
    display: inline-flex;
    align-items: center;
    padding: 9px 20px;
    background: var(--purple);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    line-height: 1;
    transition: background 0.2s, transform 0.15s;
  }

  .btn-cta:hover {
    background: var(--purple-hover);
    transform: translateY(-1px);
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--teal-bg);
    color: var(--teal);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s, transform 0.15s;
  }

  .icon-btn:hover {
    background: var(--teal);
    color: #ffffff;
    transform: scale(1.05);
  }

  .icon-btn svg { width: 17px; height: 17px; }

  .theme-toggle {
    position: relative;
    display: inline-block;
    width: 52px;
    height: 28px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .theme-toggle input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--toggle-bg);
    border-radius: var(--radius);
    transition: background 0.3s;
    overflow: hidden;
  }

  .t-icon {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    line-height: 1;
    pointer-events: none;
  }

  .t-icon.sun { left: 5px; }
  .t-icon.moon { right: 4px; }

  .toggle-knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    background: var(--toggle-knob-color);
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 2;
    pointer-events: none;
  }

  .theme-toggle input:checked ~ .toggle-knob {
    transform: translateX(24px);
  }

  .hamburger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
  }

  .hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--text-primary);
    border-radius: 2px;
  }

  .mobile-drawer {
    display: none;
    position: fixed;
    top: 68px;
    left: 0; right: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px 24px;
    box-shadow: var(--shadow);
    z-index: 999;
    flex-direction: column;
    gap: 4px;
  }

  .mobile-drawer.open { display: flex; }

  .mobile-drawer .nav-link {
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 16px;
  }

  .mobile-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 4px 4px;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }

  @media (max-width: 900px) {
    .main-nav { display: none; }
    .hamburger { display: flex; }
    .header-controls .btn-cta,
    .header-controls .icon-btn,
    .header-controls .theme-toggle { display: none; }
  }

  @media (max-width: 480px) {
    .header-inner { padding: 0 16px; gap: 12px; }
  }
</style>

<script>
  (function() {
    const html = document.documentElement;
    const desktopToggle = document.getElementById('themeToggle');
    const mobileToggle  = document.getElementById('themeToggleMobile');
    const hamburger     = document.getElementById('hamburger');
    const drawer        = document.getElementById('mobileDrawer');

    function setTheme(dark) {
      html.setAttribute('data-theme', dark ? 'dark' : 'light');
      desktopToggle.checked = dark;
      mobileToggle.checked  = dark;
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark') setTheme(true);

    desktopToggle.addEventListener('change', () => setTheme(desktopToggle.checked));
    mobileToggle.addEventListener('change',  () => setTheme(mobileToggle.checked));

    hamburger.addEventListener('click', () => {
      const open = drawer.classList.toggle('open');
      hamburger.setAttribute('aria-expanded', open);
    });

    drawer.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        drawer.classList.remove('open');
        hamburger.setAttribute('aria-expanded', false);
      });
    });
  })();
</script>
