<style>
  .feature-section {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px 64px;

  .feature-bg {

    transition: transform 0.5s ease;

    transform: scale(1.03);
  }

  /* OVERLAY */
  .feature-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.15) 0%,
      rgba(0,0,0,0.25) 40%,
      rgba(0,0,0,0.72) 100%

  }

  /* BADGE */
  .feature-badge {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 3;
    background: rgba(20,20,20,0.75);
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 4px;
    backdrop-filter: blur(4px);
  }

  /* CONTENT */
  .feature-content {
    position: relative;
    z-index: 2;
    width: 100%;
    padding: 40px 48px;
    text-align: center;
  }

  .feature-title {
    font-size: clamp(28px, 4vw, 52px);
    font-weight: 800;
    color: #ffffff;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
    display: inline;
    background: rgba(20,20,20,0.55);
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
    padding: 4px 10px;
    border-radius: 3px;
  }

  .feature-excerpt {
    font-size: 16px;
    color: rgba(255,255,255,0.88);
    line-height: 1.65;
    max-width: 560px;
    margin: 16px auto 20px;
  }

  /* META ROW */
  .feature-meta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(20,20,20,0.6);
    backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    flex-wrap: wrap;
    justify-content: center;
  }

  .feature-readtime,

    display: flex;

    gap: 5px;

  .feature-readtime svg,

  }

  .feature-author {

    align-items: center;

    height: 26px;

    border: 2px solid rgba(255,255,255,0.4);
  }

  .feature-sep {
    opacity: 0.4;
    font-size: 16px;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .feature-section { padding: 0 16px 48px; }

  }
</style>
