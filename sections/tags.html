  .tags-section {
    width: 100%;

  }

  /* Fade edges setup */
  .tags-track-wrap {
    position: relative;
    overflow: hidden;
    width: 100%;
  }

  .tags-track-wrap::before,
  .tags-track-wrap::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 80px;
    z-index: 2;
    pointer-events: none;
  }

  .tags-track-wrap::before {
    left: 0;
    background: linear-gradient(to right, var(--global-bg, #fafafa), transparent);
  }

  .tags-track-wrap::after {
    right: 0;
    background: linear-gradient(to left, var(--global-bg, #fafafa), transparent);
  }

  /* Marquee Track Container */
  .tags-track {
    display: flex;
    width: max-content;
    user-select: none;
    /* THE FIXED LAYOUT PROPERTY: Prevents physical mobile native overflow conflict */
    overflow: visible; 
  }

  /* Structural groups containing the element lists */
  .tags-group {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 6px;
    flex-shrink: 0;
    /* 35-second uniform slide loop. */
    animation: marqueeLinear 35s linear infinite;
    /* THE MOBILE AUTO-SCROLL FIX: Forces mobile rendering engines to initialize animations */
    will-change: transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }

  /* THE HOVER PAUSE: Freezes animation on desktop hover & mobile press active states */
  .tags-track:hover .tags-group,
  .tags-track:active .tags-group {
    animation-play-state: paused;
  }

  .tag-pill {
    display: inline-flex;
    align-items: center;

    color: #5b7db8;
    background: transparent;
    transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
    flex-shrink: 0;
  }

  .tag-pill:hover {
    background: var(--purple, #7c3aed);
    border-color: var(--purple, #7c3aed);

  }

  /* Infinite hardware accelerated marquee tracking loop */
  @keyframes marqueeLinear {
    0% {
      transform: translate3d(0, 0, 0);
    }
    100% {
      transform: translate3d(-100%, 0, 0);
    }
  }

  @media (max-width: 580px) {
