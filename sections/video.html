<!-- ══════════════════════════════════════
     FEATURED VIDEO SECTION
══════════════════════════════════════ -->
<section class="video-feature">
  <div class="video-grid">

    <!-- FEATURED VIDEO -->
    <div class="video-main">
      <img class="video-bg" src="https://img.youtube.com/vi/VIDEO_ID/maxresdefault.jpg" alt="Featured video" />
      <div class="video-overlay"></div>

      <button class="video-play-btn" data-id="VIDEO_ID"></button>

      <div class="video-main-info">
        <h2 class="video-title">Featured Video Title</h2>
        <p class="video-desc">A short description of the featured video goes here...</p>
      </div>
    </div>

    <!-- PLAYLIST -->
    <div class="video-playlist" id="videoPlaylist">
      <!-- JS will inject 3 items -->
    </div>

  </div>
</section>

<style>
  .video-feature {
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 32px 80px;
  }

  .video-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 32px;
  }

  /* FEATURED VIDEO */
  .video-main {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    min-height: 420px;
    background: #000;
  }

  .video-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .video-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.25),
      rgba(0,0,0,0.75)
    );
  }

  .video-play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
    cursor: pointer;
  }

  .video-play-btn::before {
    content: "▶";
    font-size: 36px;
    color: #fff;
    margin-left: 6px;
  }

  .video-main-info {
    position: absolute;
    bottom: 24px;
    left: 24px;
    right: 24px;
    z-index: 3;
  }

  .video-title {
    font-size: clamp(24px, 4vw, 40px);
    font-weight: 800;
    margin-bottom: 10px;
    color: #fff;
  }

  .video-desc {
    font-size: 15px;
    color: rgba(255,255,255,0.85);
    max-width: 520px;
  }

  /* PLAYLIST */
  .video-playlist {
    display: grid;
    gap: 24px;
  }

  .video-item {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: #222;
    cursor: pointer;
  }

  .video-item img {
    width: 100%;
    height: 150px;
    object-fit: cover;
  }

  .video-item .video-item-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: none;
    backdrop-filter: blur(4px);
  }

  .video-item .video-item-btn::before {
    content: "▶";
    font-size: 20px;
    color: #fff;
    margin-left: 4px;
  }

  .video-item h3 {
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px;
    color: #fff;
  }

  @media (max-width: 900px) {
    .video-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<script>
  const playlistId = "YOUR_PLAYLIST_ID";
  const apiKey = "YOUR_YOUTUBE_API_KEY";
  const playlistContainer = document.getElementById("videoPlaylist");

  async function loadPlaylist() {
    const res = await fetch(
      `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=3&playlistId=${playlistId}&key=${apiKey}`
    );
    const data = await res.json();

    data.items.forEach(item => {
      const id = item.snippet.resourceId.videoId;
      const title = item.snippet.title;
      const thumb = item.snippet.thumbnails.medium.url;

      const el = document.createElement("div");
      el.className = "video-item";
      el.innerHTML = `
        <img src="${thumb}" alt="${title}">
        <button class="video-item-btn" data-id="${id}"></button>
        <h3>${title}</h3>
      `;
      playlistContainer.appendChild(el);
    });
  }

  loadPlaylist();
</script>
