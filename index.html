<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Wire — Independent Daily Dispatch</title>
<meta name="description" content="A multi-desk publication covering world affairs, culture, technology, business and science.">

<!-- Markdown renderer for the blog engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js" defer></script>

<style>
  /* Minimal global resets ONLY — allowed because they do not style layout */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg, #fff); color: var(--fg, #111); }
  img { max-width: 100%; display: block; }
</style>
</head>

<body>

<!-- Mount points for sovereign sections -->
<div id="mount-header"></div>
<div id="mount-featured"></div>
<div id="mount-about"></div>
<div id="mount-categories"></div>
<div id="mount-blog-slider"></div>
<div id="mount-posts-list"></div>
<div id="mount-testimonials"></div>
<div id="mount-video"></div>
<div id="mount-cta"></div>
<div id="mount-footer"></div>

<!-- Back to top button -->
<button id="backToTop" aria-label="Back to top">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="19" x2="12" y2="5"/>
    <polyline points="5 12 12 5 19 12"/>
  </svg>
</button>

<!-- JS -->
<script src="js/main.js" defer></script>
<script src="js/blog.js" defer></script>

<script defer>
  /* Section list */
  const SECTIONS = [
    ["mount-header", "sections/header.html"],
    ["mount-featured", "sections/featured-post.html"],
    ["mount-about", "sections/about.html"],
    ["mount-categories", "sections/categories.html"],
    ["mount-blog-slider", "sections/blog-slider.html"],
    ["mount-posts-list", "sections/posts-list.html"],
    ["mount-testimonials", "sections/testimonials.html"],
    ["mount-video", "sections/video.html"],
    ["mount-cta", "sections/cta.html"],
    ["mount-footer", "sections/footer.html"],
  ];

  /* Load all sections */
  async function loadSections() {
    await Promise.all(SECTIONS.map(async ([mountId, url]) => {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        const html = await res.text();
        document.getElementById(mountId).innerHTML = html;
      } catch (err) {
        console.error(`[Wire] Could not load ${url}.`, err);
        document.getElementById(mountId).innerHTML =
          `<div style="padding:24px;color:#b34;font-family:monospace;font-size:13px;">
            Could not load ${url}. Serve this site with a local server (not file://).
           </div>`;
      }
    }));
  }

  /* Ready handler */
  function whenReady(fn) {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", fn);
    } else fn();
  }

  /* Boot sequence */
  whenReady(async () => {
    await loadSections();
    window.WireBoot && window.WireBoot();        // UI: header, menu, sliders, theme, animations
    window.WireBlogBoot && window.WireBlogBoot(); // Blog: markdown → posts
  });
</script>

</body>
</html>
