<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: sans-serif;
}
main {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 24px;
}
</style>
</head>

<body>

<!-- Hero will be injected here -->
<div id="hero"></div>

<main>
  <h1>Welcome</h1>
  <p>This is your front page.</p>
</main>

<script>
// Load hero.html into #hero
fetch("hero.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("hero").innerHTML = html;
  });
</script>

</body>
</html>
