<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knutagon Blog</title>

  <!-- Minimal reset (allowed because it's inside THIS file, not global) -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Inter, sans-serif;
      background: #fafafa;
      color: #111;
    }
  </style>
</head>

<body>

  <!-- SECTION MOUNTS -->
  <div id="header"></div>
  <div id="hero"></div>
  <div id="featured"></div>
  <div id="blog-list"></div>
  <div id="footer"></div>

  <!-- SECTION LOADER -->
  <script>
    async function loadSection(id, file) {
      try {
        const html = await fetch(`/sections/${file}`).then(r => r.text());
        document.getElementById(id).innerHTML = html;
      } catch (e) {
        console.error("Failed loading section:", file, e);
      }
    }

    loadSection('header', 'header.html');
    loadSection('hero', 'hero.html');
    loadSection('featured', 'featured-posts.html');
    loadSection('blog-list', 'blog-list.html');
    loadSection('footer', 'footer.html');
  </script>

</body>
</html>
