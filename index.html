<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #34D597;
  --border: #0d1b4c;
  --border-light: #ddd;
  --logo: #121112;
  --text: #1a1a2e;
  --accent: #7012a6;
  --cta-bg: #6b0dbd;
  --cta-text: #ffffff;
  --toggle-bg: #ffffff;
  --toggle-icon: #1a5cff;
}

html[data-theme="dark"] {
  --bg: #0d1128;
  --border: #1a5cff;
  --border-light: #333a5c;
  --logo: #34D597;
  --text: #eaeaf5;
  --accent: #34D597;
  --cta-bg: #34D597;
  --cta-text: #1a1a1a;
  --toggle-bg: #0d1128;
  --toggle-icon: #34D597;
}

body { margin: 0; }

header {
  width: 100%;
  background: var(--bg);
  border-bottom: 3px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1000;
  transition: box-shadow 0.2s ease;
}

header.scrolled {
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

.inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  color: var(--logo);
  text-decoration: none;
  white-space: nowrap;
}

/* Desktop nav */
nav {
  display: flex;
  gap: 28px;
  flex: 1;
  justify-content: center;
  flex-wrap: wrap;
}

nav a {
  color: var(--text);
  text-decoration: none;
  font-weight: 600;
  font-size: 15px;
  white-space: nowrap;
}

nav a:hover {
  color: var(--accent);
}

/* Dropdown */
.dropdown {
  position: relative;
  display: inline-block;
}

.dropbtn {
  background: none;
  border: none;
  color: var(--text);
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  white-space: nowrap;
}

.dropbtn:hover {
  color: var(--accent);
}

.dropdown-content {
  display: none;
  position: absolute;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 6px;
  min-width: 180px;
  padding: 10px 0;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  z-index: 2000;
}

.dropdown-content a {
  display: block;
  padding: 10px 16px;
  color: var(--text);
  text-decoration: none;
  font-weight: 600;
}

.dropdown-content a:hover {
  color: var(--accent);
}

.dropdown:hover .dropdown-content {
  display: block;
}

/* Hamburger button */
.pub-hamburger {
  display: none;
  background: none;
  border: none;
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
}

/* Mobile menu */
.pub-mobile-menu {
  display: none;
  flex-direction: column;
  background: var(--bg);
  border-top: 2px solid var(--border);
  padding: 10px 0;
}

.pub-mobile-menu a {
  padding: 12px 16px;
  text-decoration: none;
  color: var(--text);
  font-weight: 600;
}

.pub-mobile-menu a:hover {
  color: var(--accent);
}

/* Actions */
.actions {
  display: flex;
  align-items: center;
  gap: 14px;
}

.cta {
  background: var(--cta-bg);
  color: var(--cta-text);
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  padding: 10px 20px;
  border-radius: 8px;
  white-space: nowrap;
}

.cta:hover { opacity: 0.9; }

.toggle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border-light);
  background: var(--toggle-bg);
  color: var(--toggle-icon);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.toggle:hover {
  border-color: var(--accent);
}

/* Mobile layout */
@media (max-width: 1024px) {
  #desktopNav { display: none; }
  .pub-hamburger { display: block; }
}

</style>
</head>

  </div>
</header>

<main style="max-width: 900px; margin: 60px auto; padding: 0 24px;">

  <p>This is your front page.</p>
