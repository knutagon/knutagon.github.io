<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f7f8f8;
  color: #111;
}

main {
  max-width: 900px;
  margin: 60px auto;
  padding: 0 24px;
}
</style>
</head>

<body>

<div id="hero"></div>
<div id="featuredPosts"></div>
<div id="about"></div>
<div id="heroSlider"></div>
<div id="tagFilter"></div>

<main>
  <h1>Welcome</h1>
  <p>This is your front page.</p>
</main>

<script>
// Load hero.html
fetch("hero.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("hero").innerHTML = html;

    const header = document.getElementById('header');
    const toggle = document.getElementById('themeToggle');
    const sun = document.getElementById('iconSun');
    const moon = document.getElementById('iconMoon');
    const pubHamburger = document.getElementById('pubHamburger');
    const pubMobileMenu = document.getElementById('pubMobileMenu');
    const closeMenu = document.getElementById('closeMenu');
    const searchInput = document.getElementById('searchInput');
    const autocompleteList = document.getElementById('autocompleteList');

    function onScroll() {
      header.classList.toggle('scrolled', window.scrollY > 8);
    }
    window.addEventListener('scroll', onScroll);
    onScroll();

    const root = document.documentElement;
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      root.setAttribute('data-theme', 'dark');
      sun.style.display = 'none';
      moon.style.display = 'block';
    }

    toggle.addEventListener('click', () => {
      const isDark = root.getAttribute('data-theme') === 'dark';
      root.setAttribute('data-theme', isDark ? '' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      sun.style.display = isDark ? 'block' : 'none';
      moon.style.display = isDark ? 'none' : 'block';
    });

    pubHamburger.addEventListener('click', () => pubMobileMenu.classList.add('open'));
    closeMenu.addEventListener('click', () => pubMobileMenu.classList.remove('open'));

    const suggestions = [
      "Home","About","Articles","Podcast","Press",
      "Tech","Philosophy","Culture","Systems","Soul Dragon"
    ];

    searchInput.addEventListener('input', function() {
      const value = this.value.toLowerCase();
      autocompleteList.innerHTML = "";
      if (!value) { autocompleteList.style.display = "none"; return; }
      const matches = suggestions.filter(s => s.toLowerCase().includes(value));
      if (!matches.length) { autocompleteList.style.display = "none"; return; }
      matches.forEach(match => {
        const item = document.createElement('div');
        item.textContent = match;
        item.onclick = () => {
          searchInput.value = match;
          autocompleteList.style.display = "none";
        };
        autocompleteList.appendChild(item);
      });
      autocompleteList.style.display = "flex";
    });
  });

  // Load featured_posts.html
fetch("featured_posts.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("featuredPosts").innerHTML = html;
  });


// Load about.html
fetch("about.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("about").innerHTML = html;
  });

// Load hero_slider.html
fetch("hero_slider.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("heroSlider").innerHTML = html;
  });

// Load tag_filter.html
fetch("tag_filter.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("tagFilter").innerHTML = html;

    // Tag filter JS
    const buttons = document.querySelectorAll('.tag-buttons button');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Filtering logic goes here later
      });
    });
  });
</script>

</body>
</html>
