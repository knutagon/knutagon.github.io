<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

  :root {
    --bg: #34D597;
    --border: #0d1b4c;
    --border-light: #ddd;

    --logo: #121112;
    --text: #1a1a2e;
    --accent: #7012a6;

    --cta-bg: #6b0dbd;
    --cta-text: #ffffff;

    --toggle-bg: #ffffff;
    --toggle-icon: #1a5cff;
  }

  html[data-theme="dark"] {
    --bg: #0d1128;
    --border: #1a5cff;
    --border-light: #333a5c;

    --logo: #34D597;
    --text: #eaeaf5;
    --accent: #34D597;

    --cta-bg: #34D597;
    --cta-text: #1a1a1a;

    --toggle-bg: #0d1128;
    --toggle-icon: #34D597;
  }

  body { margin: 0; }

  header {
    width: 100%;
    background: var(--bg);
    border-bottom: 3px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1000;
    transition: box-shadow 0.2s ease;
  }

  header.scrolled {
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }

  .inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    color: var(--logo);
    text-decoration: none;
    white-space: nowrap;
  }

  nav {
    display: flex;
    gap: 28px;
    flex: 1;
    justify-content: center;
    flex-wrap: wrap;
  }

  nav a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
  }

  nav a:hover {
    color: var(--accent);
  }

  /* Dropdown */
  .dropdown {
    position: relative;
    display: inline-block;
  }

  .dropbtn {
    background: none;
    border: none;
    color: var(--text);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
  }

  .dropbtn:hover {
    color: var(--accent);
  }

  .dropdown-content {
    display: none;
    position: absolute;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 6px;
    min-width: 180px;
    padding: 10px 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    z-index: 2000;
  }

  .dropdown-content a {
    display: block;
    padding: 10px 16px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
  }

  .dropdown-content a:hover {
    color: var(--accent);
  }

  .dropdown:hover .dropdown-content {
    display: block;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .cta {
    background: var(--cta-bg);
    color: var(--cta-text);
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 8px;
    white-space: nowrap;
  }

  .cta:hover { opacity: 0.9; }

  .toggle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border-light);
    background: var(--toggle-bg);
    color: var(--toggle-icon);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .toggle:hover {
    border-color: var(--accent);
  }

  @media (max-width: 860px) {
    .inner { flex-wrap: wrap; }
    nav { order: 3; width: 100%; justify-content: flex-start; gap: 18px; }
  }

/* Hamburger button (mobile only) */
.pub-hamburger {
  display: none;
  background: none;
  border: none;
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
}

/* Mobile menu container */
.pub-mobile-menu {
  display: none;
  flex-direction: column;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 6px;
  padding: 10px 0;
  margin-top: 10px;
}

.pub-mobile-menu a {
  padding: 12px 16px;
  text-decoration: none;
  color: var(--text);
  font-weight: 600;
}

.pub-mobile-menu a:hover {
  color: var(--accent);
}

/* Show hamburger on mobile */
@media (max-width: 860px) {
  .pub-hamburger {
    display: block;
  }

  /* Hide desktop dropdown on mobile */
  .dropdown {
    display: none;
  }
}

</style>
</head>

<body>

<header id="header">
  <div class="inner">

    <a href="/" class="logo">Home</a>

    <nav>
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/articles/">Articles</a>
      <a href="/podcast/">Podcast</a>
      <a href="/press/">Press</a>

      <div class="dropdown">
        <button class="dropbtn">Publications ▾</button>
        <div class="dropdown-content">
          <a href="/pub/tech/">Tech</a>
          <a href="/pub/philosophy/">Philosophy</a>
          <a href="/pub/culture/">Culture</a>
          <a href="/pub/systems/">Systems</a>
          <a href="/pub/souldragon/">Soul Dragon™</a>
<div class="pub-mobile-menu" id="pubMobileMenu">
  <a href="/pub/tech/">Tech</a>
  <a href="/pub/philosophy/">Philosophy</a>
  <a href="/pub/culture/">Culture</a>
  <a href="/pub/systems/">Systems</a>
  <a href="/pub/souldragon/">Soul Dragon™</a>
</div>
<button class="pub-hamburger" id="pubHamburger" aria-label="Open publications menu">
  ☰
</button>
        </div>
      </div>
    </nav>

    <div class="actions">
      <a href="/subscribe/" class="cta">Free Newsletter</a>

      <button class="toggle" id="themeToggle" aria-label="Toggle dark mode">

        <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4
                   M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
        </svg>

        <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>
        </svg>

      </button>
    </div>

  </div>
</header>

<main style="max-width: 900px; margin: 60px auto; padding: 0 24px;">
  <h1>Welcome</h1>
  <p>This is your front page.</p>
</main>

<script>

  /* Scroll shadow */
  var header = document.getElementById('header');
  function onScroll() {
    if (window.scrollY > 8) header.classList.add('scrolled');
    else header.classList.remove('scrolled');
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* Theme toggle */
  var root = document.documentElement;
  var toggle = document.getElementById('themeToggle');
  var sun = document.getElementById('iconSun');
  var moon = document.getElementById('iconMoon');

  var saved = localStorage.getItem('theme');

  if (saved === 'dark') {
    root.setAttribute('data-theme', 'dark');
    sun.style.display = 'none';
    moon.style.display = 'block';
  }

  toggle.addEventListener('click', function() {
    var isDark = root.getAttribute('data-theme') === 'dark';

    if (isDark) {
      root.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
      sun.style.display = 'block';
      moon.style.display = 'none';
    } else {
      root.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
      sun.style.display = 'none';
      moon.style.display = 'block';
    }
  });

/* Mobile Publications menu toggle */
var pubHamburger = document.getElementById('pubHamburger');
var pubMobileMenu = document.getElementById('pubMobileMenu');

pubHamburger.addEventListener('click', function() {
  var isOpen = pubMobileMenu.style.display === 'flex';
  pubMobileMenu.style.display = isOpen ? 'none' : 'flex';
});

</script>

</body>
</html>
