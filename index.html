<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knutagon Blog</title>

  <!-- Global Base Variables & Reset -->
  <style>
    :root {
      --global-bg: #fafafa;
      --global-text: #111111;
      --transition-speed: 0.3s;
    }

    [data-theme="dark"] {
      --global-bg: #121212;
      --global-text: #f5f5f5;
    }

    html {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Inter, sans-serif;
      background-color: var(--global-bg);
      color: var(--global-text);
      padding-top: 68px;
      transition: background-color var(--transition-speed), color var(--transition-speed);
      overflow-x: hidden;
      width: 100%;
    }

    body.menu-active {
      overflow: hidden;
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    body.menu-active .menu-overlay {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- HOMEPAGE SECTION MOUNTS -->
  <div id="header"></div>
  <div id="hero"></div>
  <div id="about"></div>
  <div id="cat-banner"></div>
  <div id="tags"></div>
  <div id="feature"></div>
  <div id="bloglist"></div>
  <div id="readmore"></div>
  <div id="video"></div>
  <div id="banner"></div>
  <div id="faq"></div>
  <div id="glossary"></div>
  <div id="trust"></div>
  <div id="footer"></div>

  <script>
    // 1. Theme Orchestration Engine
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      const inputs = document.querySelectorAll('#themeToggle, #themeToggleMobile');
      inputs.forEach(input => input.checked = (theme === 'dark'));
    }

    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    // 2. Global Event Listening
    document.addEventListener('change', (e) => {
      if (e.target && (e.target.id === 'themeToggle' || e.target.id === 'themeToggleMobile')) {
        applyTheme(e.target.checked ? 'dark' : 'light');
      }
    });

    function closeMenu() {
      document.body.classList.remove('menu-active');
      const burgerBtn = document.getElementById('hamburger');
      if (burgerBtn) burgerBtn.setAttribute('aria-expanded', 'false');
    }

    // 🔍 INDEXED SUB-PAGE SEARCH STORAGE ENGINE
    let searchDatabase = [];
    
    // 📂 Add/modify the content page filenames you put inside /sections/pages/ here:
    const pagesToSearch = [
      'about-us.html', 
      'privacy-policy.html', 
      'terms.html',
      'welcome-post.html'
    ];

    async function buildSearchIndex() {
      if (searchDatabase.length > 0) return; // Already built!
      
      const promises = pagesToSearch.map(async (file) => {
        try {
          // Fetch raw file text directly out of the content pages subdirectory
          const rawHtml = await fetch(`/sections/pages/${file}`).then(r => r.text());
          
          // Parse HTML code out cleanly to isolate text strings
          const parser = new DOMParser();
          const doc = parser.parseFromString(rawHtml, 'text/html');
          
          // Clean out excessive layout line breaks and spaces
          const cleanText = (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
          
          // Generate a beautifully formatted visual title based on filename
          const cleanTitle = file.replace('.html', '')
                                 .split('-')
                                 .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                                 .join(' ');

          return {
            filename: file,
            title: cleanTitle,
            text: cleanText,
            words: cleanText.toLowerCase().split(/\W+/).filter(Boolean)
          };
        } catch (e) {
          console.error("Could not index sub-page for search:", file, e);
          return null;
        }
      });

      searchDatabase = (await Promise.all(promises)).filter(Boolean);
    }

    function openSearch() {
      closeMenu(); // Close mobile panel if open
      const overlay = document.getElementById('searchOverlay');
      if (overlay) {
        overlay.classList.add('active');
        const input = document.getElementById('searchInput');
        if (input) {
          input.value = '';
          input.focus();
        }
        document.getElementById('searchHint').textContent = '';
        document.getElementById('searchResults').innerHTML = '';
        buildSearchIndex(); // Pre-fetch and parse target content pages in background
      }
    }

    function closeSearch() {
      const overlay = document.getElementById('searchOverlay');
      if (overlay) overlay.classList.remove('active');
    }

    // Capture global layout click behaviors
    document.addEventListener('click', (e) => {
      // Toggle Hamburger Menu
      const hamburger = e.target.closest('#hamburger');
      if (hamburger) {
        document.body.classList.toggle('menu-active');
        const isOpen = document.body.classList.contains('menu-active');
        hamburger.setAttribute('aria-expanded', isOpen);
        return;
      }

      if (e.target.id === 'menuOverlay' || e.target.closest('#drawerClose')) {
        closeMenu();
        return;
      }

      if (e.target.closest('.mobile-drawer .nav-link')) {
        closeMenu();
        return;
      }

      // Open search button click
      if (e.target.closest('.search-trigger')) {
        openSearch();
        return;
      }

      // Close search triggers
      if (e.target.id === 'searchOverlay' || e.target.closest('#searchClose')) {
        closeSearch();
        return;
      }
    });

    // Handle Live Inline Input Suggestion Event Pipeline
    document.addEventListener('input', (e) => {
      if (e.target && e.target.id === 'searchInput') {
        const query = e.target.value.toLowerCase().trim();
        const hintLayer = document.getElementById('searchHint');
        const resultsLayer = document.getElementById('searchResults');

        if (!query) {
          hintLayer.textContent = '';
          resultsLayer.innerHTML = '';
          return;
        }

        let bestHint = '';
        let matchHtml = '';
        let matchCount = 0;

        searchDatabase.forEach(item => {
          const indexIdx = item.text.toLowerCase().indexOf(query);
          
          if (indexIdx !== -1) {
            matchCount++;
            
            // Try matching an active autocompletion hint phrase word sequence
            if (!bestHint) {
              const matchingWord = item.words.find(w => w.startsWith(query));
              if (matchingWord && matchingWord !== query) {
                // Match visual text alignment length casing beautifully
                bestHint = e.target.value + matchingWord.slice(query.length);
              }
            }

            // Slice out relative contextual string preview snippet
            const start = Math.max(0, indexIdx - 30);
            const end = Math.min(item.text.length, indexIdx + 80);
            let snippet = item.text.slice(start, end);
            if (start > 0) snippet = '...' + snippet;
            if (end < item.text.length) snippet = snippet + '...';

            // Wrap query match instances in strong emphasis tags
            const safeSnippet = snippet.replace(new RegExp(query, 'gi'), match => `<strong>${match}</strong>`);

            // Direct links straight to your content sub-page files
            matchHtml += `
              <a href="/sections/pages/${item.filename}" class="search-result-item" onclick="closeSearch()">
                <div class="search-result-title">${item.title}</div>
                <div class="search-result-snippet">${safeSnippet}</div>
              </a>
            `;
          }
        });

        // Inject the inline gray hint suggestion layer text values
        hintLayer.textContent = bestHint;
        
        // Render search structural records matching the key term
        if (matchCount > 0) {
          resultsLayer.innerHTML = matchHtml;
        } else {
          resultsLayer.innerHTML = `<div class="search-empty">No results found inside pages matching "${e.target.value}"</div>`;
        }
      }
    });

    // Capture Keyboard Operations (Tab handles auto-complete, Escape closes)
    document.addEventListener('keydown', (e) => {
      const searchInput = document.getElementById('searchInput');
      const searchOverlay = document.getElementById('searchOverlay');
      if (!searchInput || !searchOverlay || !searchOverlay.classList.contains('active')) return;

      if (e.key === 'Escape') {
        closeSearch();
      }
      
      if (e.key === 'Tab') {
        const hintLayer = document.getElementById('searchHint');
        if (hintLayer && hintLayer.textContent) {
          e.preventDefault(); // Lock cursor switching out of focus container elements
          searchInput.value = hintLayer.textContent;
          hintLayer.textContent = '';
        }
      }
    });

    // 3. Dynamic Section Loader
    async function loadSection(id, file) {
      try {
        const html = await fetch(`/sections/${file}`).then(r => r.text());
        const target = document.getElementById(id);
        target.innerHTML = html;

        if (id === 'header') {
          const activeTheme = document.documentElement.getAttribute('data-theme');
          const inputs = target.querySelectorAll('#themeToggle, #themeToggleMobile');
          inputs.forEach(input => input.checked = (activeTheme === 'dark'));
        }
        if (id === 'tags') initTagSlider(target);
        if (id === 'bloglist' || id === 'readmore') initMobileSliders(target);
      } catch (e) {
        console.error("Failed loading section:", file, e);
      }
    }

    // 4. Slider Modules
    function initTagSlider(sectionElement) {
      const track = sectionElement.querySelector('.tag-track');
      if (track) {
        track.innerHTML += track.innerHTML;
      }
    }

    function initMobileSliders(sectionElement) {
      const containers = sectionElement.querySelectorAll('.post-slider-container');
      containers.forEach(container => {
        const row = container.querySelector('.post-row');
        const dotsContainer = container.querySelector('.slider-dots');
        if (!row || !dotsContainer) return;

        function renderDots() {
          const items = row.children;
          if (items.length === 0) return;
          const gap = parseInt(window.getComputedStyle(row).gap) || 0;
          const cardWidth = items[0].offsetWidth + gap;
          const currentStep = Math.round(row.scrollLeft / cardWidth);

          dotsContainer.innerHTML = '';
          for (let i = 0; i < items.length; i++) {
            const dot = document.createElement('span');
            dot.className = `dot ${i === currentStep ? 'active' : ''}`;
            dot.addEventListener('click', () => {
              row.scrollTo({ left: i * cardWidth, behavior: 'smooth' });
            });
            dotsContainer.appendChild(dot);
          }
        }
        row.addEventListener('scroll', renderDots);
        window.addEventListener('resize', renderDots);
        setTimeout(renderDots, 150);
      });
    }

    // Kick off homepage assembly layout loaders
    loadSection('header', 'header.html');
    loadSection('hero', 'hero.html');
    loadSection('about', 'about.html');
    loadSection('cat-banner', 'cat-banner.html');
    loadSection('tags', 'tags.html');
    loadSection('feature', 'feature.html');
    loadSection('bloglist', 'bloglist.html');
    loadSection('readmore', 'readmore.html');
    loadSection('video', 'video.html');
    loadSection('banner', 'banner.html');
    loadSection('faq', 'faq.html');
    loadSection('glossary', 'glossary.html');
    loadSection('trust', 'trust.html');
    loadSection('footer', 'footer.html');
  </script>
</body>
</html>
