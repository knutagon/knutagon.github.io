<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knutagon Blog</title>

  <!-- Global Base Variables & Reset -->
  <style>
    :root {
      --global-bg: #fafafa;
      --global-text: #111111;
      --transition-speed: 0.3s;
    }

    [data-theme="dark"] {
      --global-bg: #121212;
      --global-text: #f5f5f5;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Inter, sans-serif;
      background-color: var(--global-bg);
      color: var(--global-text);
      padding-top: 68px; /* matches .site-header height */
      transition: background-color var(--transition-speed), color var(--transition-speed);
      overflow-x: hidden;
    }

    body.menu-active {
      overflow: hidden;
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    body.menu-active .menu-overlay {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- SECTION MOUNTS -->
  <div id="header"></div>
  <div id="hero"></div>
  <div id="about"></div>
  <div id="cat-banner"></div>
  <div id="tags"></div>
  <div id="feature"></div>
  <div id="bloglist"></div>
  <div id="readmore"></div>
  <div id="video"></div>
  <div id="banner"></div>
  <div id="faq"></div>
  <div id="glossary"></div>
  <div id="trust"></div>
  <div id="footer"></div>

  <script>
    // 1. Theme Orchestration Engine
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      
      // Sync UI checkboxes across modules if they exist in the DOM yet
      const inputs = document.querySelectorAll('#themeToggle, #themeToggleMobile');
      inputs.forEach(input => input.checked = (theme === 'dark'));
    }

    // Initialize layout immediately to prevent flashing
    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    // 2. Global Event Listening (Handles elements dynamically loaded later)
    document.addEventListener('change', (e) => {
      if (e.target && (e.target.id === 'themeToggle' || e.target.id === 'themeToggleMobile')) {
        applyTheme(e.target.checked ? 'dark' : 'light');
      }
    });

    document.addEventListener('click', (e) => {
      // Hamburger button click
      const hamburger = e.target.closest('#hamburger');
      if (hamburger) {
        document.body.classList.toggle('menu-active');
        const isOpen = document.body.classList.contains('menu-active');
        hamburger.setAttribute('aria-expanded', isOpen);
        return;
      }

      // Close menu when overlay is clicked
      if (e.target.id === 'menuOverlay') {
        document.body.classList.remove('menu-active');
        const burgerBtn = document.getElementById('hamburger');
        if (burgerBtn) burgerBtn.setAttribute('aria-expanded', 'false');
        return;
      }

      // Close menu when a link inside the mobile drawer is clicked
      const mobileLink = e.target.closest('.mobile-drawer .nav-link');
      if (mobileLink) {
        document.body.classList.remove('menu-active');
        const burgerBtn = document.getElementById('hamburger');
        if (burgerBtn) burgerBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // 3. Dynamic Section Modules Fetcher
    async function loadSection(id, file) {
      try {
        const html = await fetch(`/sections/${file}`).then(r => r.text());
        const target = document.getElementById(id);
        target.innerHTML = html;
        
        // Post-load configuration hooks
        if (id === 'header') {
          // Re-sync checkboxes right after header loads
          const activeTheme = document.documentElement.getAttribute('data-theme');
          const inputs = target.querySelectorAll('#themeToggle, #themeToggleMobile');
          inputs.forEach(input => input.checked = (activeTheme === 'dark'));
        }
        if (id === 'tags') initTagSlider(target);
        if (id === 'bloglist' || id === 'readmore') initMobileSliders(target);
      } catch (e) {
        console.error("Failed loading section:", file, e);
      }
    }

    // 4. Slider Initialization Modules
    function initTagSlider(sectionElement) {
      const track = sectionElement.querySelector('.tag-track');
      if (track) {
        track.innerHTML += track.innerHTML;
      }
    }

    function initMobileSliders(sectionElement) {
      const containers = sectionElement.querySelectorAll('.post-slider-container');
      containers.forEach(container => {
        const row = container.querySelector('.post-row');
        const dotsContainer = container.querySelector('.slider-dots');
        if (!row || !dotsContainer) return;

        function renderDots() {
          const items = row.children;
          if (items.length === 0) return;
          const gap = parseInt(window.getComputedStyle(row).gap) || 0;
          const cardWidth = items[0].offsetWidth + gap;
          const currentStep = Math.round(row.scrollLeft / cardWidth);
          
          dotsContainer.innerHTML = '';
          for (let i = 0; i < items.length; i++) {
            const dot = document.createElement('span');
            dot.className = `dot ${i === currentStep ? 'active' : ''}`;
            dot.addEventListener('click', () => {
              row.scrollTo({ left: i * cardWidth, behavior: 'smooth' });
            });
            dotsContainer.appendChild(dot);
          }
        }
        row.addEventListener('scroll', renderDots);
        window.addEventListener('resize', renderDots);
        setTimeout(renderDots, 150);
      });
    }

    // Kick off content rendering
    loadSection('header', 'header.html');
    loadSection('hero', 'hero.html');
    loadSection('about', 'about.html');
    loadSection('cat-banner', 'cat-banner.html');
    loadSection('tags', 'tags.html');
    loadSection('feature', 'feature.html');
    loadSection('bloglist', 'bloglist.html');
    loadSection('readmore', 'readmore.html');
    loadSection('video', 'video.html');
    loadSection('banner', 'banner.html');
    loadSection('faq', 'faq.html');
    loadSection('glossary', 'glossary.html');
    loadSection('trust', 'trust.html');
    loadSection('footer', 'footer.html');
  </script>
</body>
</html>
