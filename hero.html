<style>
/* HEADER + SLIDE-IN MENU ONLY */

/* Header */
header {
  width: 100%;
  background: #34D597;
  border-bottom: 3px solid #0d1b4c;
  position: sticky;
  top: 0;
  z-index: 1000;
  transition: box-shadow 0.2s ease;
}

 /* Make hero.html sticky under the header */
.hero {
  position: sticky;
  top: 72px;
  z-index: 900;
}


header.scrolled {
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

.inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  color: #121112;
  text-decoration: none;
  white-space: nowrap;
}

/* Desktop nav */
nav {
  display: flex;
  gap: 28px;
  flex: 1;
  justify-content: center;
  flex-wrap: wrap;
}

nav a {
  color: #1a1a2e;
  text-decoration: none;
  font-weight: 600;
  font-size: 15px;
  white-space: nowrap;
}

nav a:hover {
  color: #7012a6;
}

/* Dropdown */
.dropdown {
  position: relative;
  display: inline-block;
}

.dropbtn {
  background: none;
  border: none;
  color: #1a1a2e;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
}

.dropdown-content {
  display: none;
  position: absolute;
  background: #34D597;
  border: 2px solid #0d1b4c;
  border-radius: 6px;
  min-width: 180px;
  padding: 10px 0;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

.dropdown-content a {
  display: block;
  padding: 10px 16px;
  color: #1a1a2e;
  font-weight: 600;
}

.dropdown:hover .dropdown-content {
  display: block;
}

/* Search box */
.search-box {
  position: relative;
  display: flex;
  align-items: center;
  background: #ffffff;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 6px 10px;
}

.search-box input {
  border: none;
  outline: none;
  background: transparent;
  color: #1a1a2e;
  font-size: 14px;
  width: 140px;
}

.autocomplete-list {
  position: absolute;
  top: 40px;
  left: 0;
  right: 0;
  background: #34D597;
  border: 1px solid #0d1b4c;
  border-radius: 6px;
  display: none;
  flex-direction: column;
  z-index: 3000;
}

.autocomplete-list div {
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 600;
  color: #1a1a2e;
}

.autocomplete-list div:hover {
  background: #7012a6;
  color: white;
}

/* Hamburger */
.pub-hamburger {
  display: none;
  background: none;
  border: none;
  font-size: 28px;
  font-weight: 700;
  color: #1a1a2e;
  cursor: pointer;
}

/* Slide-in menu */
.pub-mobile-menu {
  position: fixed;
  top: 0;
  right: -100%;
  width: 70%;
  height: 100%;
  background: #34D597;
  border-left: 3px solid #0d1b4c;
  display: flex;
  flex-direction: column;
  padding: 20px;
  transition: right 0.3s ease;
  z-index: 2000;
}

.pub-mobile-menu.open {
  right: 0;
}

.pub-mobile-menu a {
  padding: 12px 0;
  text-decoration: none;
  color: #1a1a2e;
  font-weight: 600;
  font-size: 16px;
}

.close-btn {
  align-self: flex-end;
  background: none;
  border: none;
  font-size: 32px;
  font-weight: 700;
  color: #1a1a2e;
  cursor: pointer;
  margin-bottom: 20px;
}

/* CTA inside menu */
.mobile-cta {
  margin-top: auto;
  background: #6b0dbd;
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  font-size: 16px;
  padding: 14px 20px;
  border-radius: 8px;
  text-align: center;
  position: relative;
  bottom: 20px;
}

/* Actions */
.actions {
  display: flex;
  align-items: center;
  gap: 14px;
}

.toggle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid #ddd;
  background: #ffffff;
  color: #1a5cff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* DARK MODE */
[data-theme="dark"] header {
  background: #0d1128;
  border-bottom-color: #1a5cff;
}

[data-theme="dark"] .logo {
  color: #34D597;
}

[data-theme="dark"] nav a {
  color: #eaeaf5;
}

[data-theme="dark"] nav a:hover {
  color: #34D597;
}

[data-theme="dark"] .dropdown-content {
  background: #0d1128;
  border-color: #1a5cff;
}

[data-theme="dark"] .dropdown-content a {
  color: #eaeaf5;
}

[data-theme="dark"] .search-box {
  background: #0d1128;
  border-color: #333a5c;
}

[data-theme="dark"] .search-box input {
  color: #eaeaf5;
}

[data-theme="dark"] .autocomplete-list {
  background: #0d1128;
  border-color: #1a5cff;
}

[data-theme="dark"] .autocomplete-list div {
  color: #eaeaf5;
}

[data-theme="dark"] .autocomplete-list div:hover {
  background: #34D597;
  color: #1a1a1a;
}

[data-theme="dark"] .pub-mobile-menu {
  background: #0d1128;
  border-left-color: #1a5cff;
}

[data-theme="dark"] .pub-mobile-menu a {
  color: #eaeaf5;
}

[data-theme="dark"] .close-btn {
  color: #eaeaf5;
}

[data-theme="dark"] .mobile-cta {
  background: #34D597;
  color: #1a1a1a;
}

[data-theme="dark"] .toggle {
  background: #0d1128;
  border-color: #333a5c;
  color: #34D597;
}

[data-theme="dark"] .pub-hamburger {
  color: #eaeaf5;
}

/* Mobile */
@media (max-width: 1024px) {
  #desktopNav { display: none; }
  .pub-hamburger { display: block; }
  .actions { gap: 10px; }
}
</style>

      <button class="pub-hamburger" id="pubHamburger">☰</button>

</header>
