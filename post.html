<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <!-- Marked.js CDN for parsing Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --global-bg: #fafafa;
            --global-text: #111111;
            --surface-color: #f0f0f0;
            --border-color: #e5e5e5;
            --accent-color: #f43f5e;
            --text-secondary: #666666;
            --transition-speed: 0.3s;
        }

        [data-theme="dark"] {
            --global-bg: #121212;
            --global-text: #f5f5f5;
            --surface-color: #1a2233;
            --border-color: #2a3447;
            --text-secondary: #94a3b8;
        }

        /* Global Reset & Base Scaling */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--global-bg);
            color: var(--global-text);
            margin: 0;
            padding: 0;
            line-height: 1.8;
            overflow-x: hidden;
            width: 100%;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        body.menu-active {
            overflow: hidden;
        }

        /* Mobile Slide-in Overlay */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        body.menu-active .menu-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        /* Full-width wrappers for header and footer */
        #header, #footer {
            width: 100%;
            overflow-x: hidden;
        }

        /* Fluid and Responsive Article Container Layout */
        #article-container {
            width: 100%;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .category {
            color: var(--accent-color);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }

        h1.post-title {
            font-size: clamp(26px, 5vw, 44px);
            font-weight: 800;
            line-height: 1.25;
            margin: 0 0 20px 0;
            letter-spacing: -0.02em;
            word-break: break-word;
        }

        .meta-area {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .author-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .meta-info {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .meta-info .author-name {
            color: var(--global-text);
            font-weight: 700;
        }

        .featured-image {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        /* Fluid Responsive Content Styles */
        .content {
            font-size: 17px;
            word-break: break-word;
        }

        .content p {
            margin-bottom: 24px;
        }

        .content h2 {
            font-size: clamp(22px, 3.5vw, 26px);
            margin-top: 35px;
            margin-bottom: 16px;
            color: var(--global-text);
            line-height: 1.3;
        }

        .content img, .content video, .content iframe {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .content pre {
            max-width: 100%;
            overflow-x: auto;
            background: var(--surface-color);
            padding: 16px;
            border-radius: 8px;
        }

        /* Author Signature Box */
        .author-box {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-top: 50px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .author-box img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .author-box h3 {
            margin: 0 0 4px 0;
            font-size: 18px;
            color: var(--global-text);
        }

        .author-box p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Previous / Next Article Navigation Grid */
        .nav-posts {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 35px;
        }

        .nav-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: border-color 0.2s, transform 0.2s;
        }

        .nav-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .nav-card span {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 6px;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        .nav-card h4 {
            margin: 0;
            font-size: 15px;
            color: var(--global-text);
            font-weight: 700;
            line-height: 1.4;
        }

        /* Desktop Breakpoint Enhancements */
        @media (min-width: 640px) {
            #article-container {
                margin: 60px auto;
                padding: 0 24px;
            }

            .nav-posts {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }

            .author-box {
                padding: 30px;
            }
        }

        @media (max-width: 480px) {
            .author-box {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- Overlay Layer for Mobile Slide-in Menu -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Header section target (full width & responsive) -->
    <div id="header"></div>

    <!-- Article container (fully mobile responsive) -->
    <article id="article-container">
        <p style="color: var(--text-secondary); text-align: center; margin-top: 60px;">Loading article...</p>
    </article>

    <!-- Footer section target (full width & responsive) -->
    <div id="footer"></div>

    <script>
        // 1. Theme Orchestration Engine
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            const inputs = document.querySelectorAll('#themeToggle, #themeToggleMobile');
            inputs.forEach(input => input.checked = (theme === 'dark'));
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);

        function closeMenu() {
            document.body.classList.remove('menu-active');
            const burgerBtn = document.getElementById('hamburger');
            if (burgerBtn) burgerBtn.setAttribute('aria-expanded', 'false');
        }

        // 2. Global Event Listeners for Theme Toggle & Mobile Menu Drawer
        document.addEventListener('change', (e) => {
            if (e.target && (e.target.id === 'themeToggle' || e.target.id === 'themeToggleMobile')) {
                applyTheme(e.target.checked ? 'dark' : 'light');
            }
        });

        document.addEventListener('click', (e) => {
            // Toggle Hamburger Menu (works for dynamically loaded headers)
            const hamburger = e.target.closest('#hamburger');
            if (hamburger) {
                document.body.classList.toggle('menu-active');
                const isOpen = document.body.classList.contains('menu-active');
                hamburger.setAttribute('aria-expanded', isOpen);
                return;
            }

            if (e.target.id === 'menuOverlay' || e.target.closest('#drawerClose')) {
                closeMenu();
                return;
            }

            if (e.target.closest('.mobile-drawer .nav-link')) {
                closeMenu();
                return;
            }
        });

        // 3. Dynamic Section Loader matching your project structure
        async function loadSection(elementId, file) {
            try {
                const pathParts = window.location.pathname.split('/').filter(Boolean);
                pathParts.pop(); // Remove 'post.html'
                const basePath = pathParts.length > 0 ? '/' + pathParts.join('/') + '/' : '/';
                const fetchUrl = `${basePath}sections/${file}`.replace(/\/+/g, '/');

                const response = await fetch(fetchUrl);
                if (response.ok) {
                    const htmlText = await response.text();
                    const target = document.getElementById(elementId);
                    target.innerHTML = htmlText;

                    if (elementId === 'header') {
                        const activeTheme = document.documentElement.getAttribute('data-theme');
                        const inputs = target.querySelectorAll('#themeToggle, #themeToggleMobile');
                        inputs.forEach(input => input.checked = (activeTheme === 'dark'));
                    }
                }
            } catch (e) {
                console.log(`Could not load section: sections/${file}`);
            }
        }

        async function loadPost() {
            // Load header and footer from sections/ folder
            loadSection('header', 'header.html');
            loadSection('footer', 'footer.html');

            const params = new URLSearchParams(window.location.search);
            const mdFile = params.get('file');
            const container = document.getElementById('article-container');

            if (!mdFile) {
                container.innerHTML = "<h2>No post specified.</h2>";
                return;
            }

            try {
                const pathParts = window.location.pathname.split('/').filter(Boolean);
                pathParts.pop(); // Remove 'post.html'
                const basePath = pathParts.length > 0 ? '/' + pathParts.join('/') + '/' : '/';
                const fetchUrl = `${basePath}posts/${mdFile}`.replace(/\/+/g, '/');

                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error("Post not found");
                const markdownText = await response.text();

                const lines = markdownText.split('\n');
                let metadata = {
                    title: "Untitled Post",
                    category: "General",
                    date: "Today",
                    image: "",
                    authorName: "Katen Doe",
                    authorBio: "Content writer fascinated by design, lifestyle, and modern tech.",
                    authorAvatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"
                };

                let bodyStartIndex = 0;

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('title:')) metadata.title = line.replace('title:', '').trim().replace(/['"]/g, '');
                    if (line.startsWith('category:')) metadata.category = line.replace('category:', '').trim().replace(/['"]/g, '');
                    if (line.startsWith('date:')) metadata.date = line.replace('date:', '').trim().replace(/['"]/g, '');
                    if (line.startsWith('image:')) metadata.image = line.replace('image:', '').trim().replace(/['"]/g, '');
                    if (line.startsWith('author:')) metadata.authorName = line.replace('author:', '').trim().replace(/['"]/g, '');
                    
                    if (line === '---' && i > 0) {
                        bodyStartIndex = i + 1;
                        break;
                    }
                }

                const rawBody = lines.slice(bodyStartIndex).join('\n');
                const wordCount = rawBody.trim().split(/\s+/).length;
                const readTime = Math.max(1, Math.ceil(wordCount / 200)) + " min read";
                const htmlContent = marked.parse(rawBody);

                container.innerHTML = `
                    <div class="category">${metadata.category}</div>
                    <h1 class="post-title">${metadata.title}</h1>
                    
                    <div class="meta-area">
                        <img src="${metadata.authorAvatar}" alt="${metadata.authorName}" class="author-avatar">
                        <div class="meta-info">
                            <span class="author-name">${metadata.authorName}</span><br>
                            ${metadata.date} &bull; ${readTime}
                        </div>
                    </div>

                    ${metadata.image ? `<img src="${metadata.image}" alt="${metadata.title}" class="featured-image">` : ''}

                    <div class="content">
                        ${htmlContent}
                    </div>

                    <div class="author-box">
                        <img src="${metadata.authorAvatar}" alt="${metadata.authorName}">
                        <div>
                            <h3>${metadata.authorName}</h3>
                            <p>${metadata.authorBio}</p>
                        </div>
                    </div>

                    <div class="nav-posts">
                        <a href="#" class="nav-card">
                            <span>Previous Post</span>
                            <h4>Explore older insights</h4>
                        </a>
                        <a href="#" class="nav-card" style="text-align: right;">
                            <span>Next Post</span>
                            <h4>Discover more stories</h4>
                        </a>
                    </div>
                `;

                document.title = metadata.title;

            } catch (error) {
                container.innerHTML = "<h2>Post not found</h2><p>Could not load the requested article file.</p>";
            }
        }

        loadPost();
    </script>
</body>
</html>
