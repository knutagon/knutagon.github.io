<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <!-- Marked.js CDN for parsing Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #12161f;
            --surface-color: #1a2233;
            --border-color: #2a3447;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-color: #f43f5e;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
            line-height: 1.8;
        }

        .category {
            color: var(--accent-color);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }

        h1.post-title {
            font-size: clamp(32px, 4vw, 44px);
            font-weight: 800;
            line-height: 1.2;
            margin: 0 0 24px 0;
            letter-spacing: -0.02em;
        }

        .meta-area {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 36px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
        }

        .author-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
        }

        .meta-info {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .meta-info .author-name {
            color: var(--text-primary);
            font-weight: 700;
        }

        .featured-image {
            width: 100%;
            max-height: 480px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .content {
            font-size: 18px;
            color: #cbd5e1;
        }

        .content p {
            margin-bottom: 24px;
        }

        .content h2 {
            font-size: 26px;
            margin-top: 40px;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        /* Author Signature Box */
        .author-box {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-top: 60px;
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .author-box img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .author-box h3 {
            margin: 0 0 6px 0;
            font-size: 20px;
            color: var(--text-primary);
        }

        .author-box p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        /* Previous / Next Article Navigation */
        .nav-posts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .nav-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: border-color 0.2s, transform 0.2s;
        }

        .nav-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .nav-card span {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 8px;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        .nav-card h4 {
            margin: 0;
            font-size: 16px;
            color: var(--text-primary);
            font-weight: 700;
            line-height: 1.4;
        }

        @media (max-width: 640px) {
            .nav-posts { grid-template-columns: 1fr; }
            .author-box { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Header section target -->
    <div id="header"></div>

    <article id="article-container">
        <p style="color: var(--text-secondary); text-align: center; margin-top: 80px;">Loading article...</p>
    </article>

    <!-- Footer section target -->
    <div id="footer"></div>

    <script>
        async function loadSection(elementId, file) {
            try {
                const pathParts = window.location.pathname.split('/').filter(Boolean);
                pathParts.pop(); // Remove 'post.html'
                const basePath = pathParts.length > 0 ? '/' + pathParts.join('/') + '/' : '/';
                const fetchUrl = `${basePath}sections/${file}`.replace(/\/+/g, '/');

                const response = await fetch(fetchUrl);
                if (response.ok) {
                    const htmlText = await response.text();
                    document.getElementById(elementId).innerHTML = htmlText;
                }
            } catch (e) {
                console.log(`Could not load section: sections/${file}`);
            }
        }

        async function loadPost() {
            // Load header and footer from sections/ folder
            loadSection('header', 'header.html');
            loadSection('footer', 'footer.html');

            const params = new URLSearchParams(window.location.search);
            const mdFile = params.get('file');
            const container = document.getElementById('article-container');

            if (!mdFile) {
                container.innerHTML = "<h2>No post specified.</h2>";
                return;
            }

            try {
                const pathParts = window.location.pathname.split('/').filter(Boolean);
                pathParts.pop(); // Remove 'post.html'
                const basePath = pathParts.length > 0 ? '/' + pathParts.join('/') + '/' : '/';
                const fetchUrl = `${basePath}posts/${mdFile}`.replace(/\/+/g, '/');

                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error("Post not found");
                const markdownText = await response.text();

                const lines = markdownText.split('\n');
                let metadata = {
                    title: "Untitled Post",
                    category: "General",
                    date: "Today",
                    image: "",
                    authorName: "Katen Doe",
                    authorBio: "Content writer fascinated by design, lifestyle, and modern tech.",
                    authorAvatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"
                };

                let bodyStartIndex = 0;

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('title:')) metadata.title = line.replace('title:', '').trim().replace(/['"]/g, '');
                    if (line.startsWith('category:')) metadata.category = line.replace('category:', '').trim().replace(/['"]/g, '');
                    if (line.startsWith('date:')) metadata.date = line.replace('date:', '').trim().replace(/['"]/g, '');
                    if (line.startsWith('image:')) metadata.image = line.replace('image:', '').trim().replace(/['"]/g, '');
                    if (line.startsWith('author:')) metadata.authorName = line.replace('author:', '').trim().replace(/['"]/g, '');
                    
                    if (line === '---' && i > 0) {
                        bodyStartIndex = i + 1;
                        break;
                    }
                }

                const rawBody = lines.slice(bodyStartIndex).join('\n');
                const wordCount = rawBody.trim().split(/\s+/).length;
                const readTime = Math.max(1, Math.ceil(wordCount / 200)) + " min read";
                const htmlContent = marked.parse(rawBody);

                container.innerHTML = `
                    <div class="category">${metadata.category}</div>
                    <h1 class="post-title">${metadata.title}</h1>
                    
                    <div class="meta-area">
                        <img src="${metadata.authorAvatar}" alt="${metadata.authorName}" class="author-avatar">
                        <div class="meta-info">
                            <span class="author-name">${metadata.authorName}</span><br>
                            ${metadata.date} &bull; ${readTime}
                        </div>
                    </div>

                    ${metadata.image ? `<img src="${metadata.image}" alt="${metadata.title}" class="featured-image">` : ''}

                    <div class="content">
                        ${htmlContent}
                    </div>

                    <div class="author-box">
                        <img src="${metadata.authorAvatar}" alt="${metadata.authorName}">
                        <div>
                            <h3>${metadata.authorName}</h3>
                            <p>${metadata.authorBio}</p>
                        </div>
                    </div>

                    <div class="nav-posts">
                        <a href="#" class="nav-card">
                            <span>Previous Post</span>
                            <h4>Explore older insights</h4>
                        </a>
                        <a href="#" class="nav-card" style="text-align: right;">
                            <span>Next Post</span>
                            <h4>Discover more stories</h4>
                        </a>
                    </div>
                `;

                document.title = metadata.title;

            } catch (error) {
                container.innerHTML = "<h2>Post not found</h2><p>Could not load the requested article file.</p>";
            }
        }

        loadPost();
    </script>
</body>
</html>
