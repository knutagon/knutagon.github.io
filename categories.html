<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>
    <style>
        :root {
            --global-bg: #fafafa;
            --global-text: #111111;
            --surface-color: #f0f0f0;
            --border-color: #e5e5e5;
            --accent-color: #f43f5e;
            --text-secondary: #666666;
            --transition-speed: 0.3s;
        }

        [data-theme="dark"] {
            --global-bg: #121212;
            --global-text: #f5f5f5;
            --surface-color: #1a2233;
            --border-color: #2a3447;
            --text-secondary: #94a3b8;
        }

        /* Global Reset & Base Scaling */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--global-bg);
            color: var(--global-text);
            margin: 0;
            padding: 0;
            line-height: 1.8;
            overflow-x: hidden;
            width: 100%;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        body.menu-active {
            overflow: hidden;
        }

        /* Mobile Slide-in Menu Overlay */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        body.menu-active .menu-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        /* Search Overlay Modal Styling */
        .search-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--global-bg);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .search-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .search-wrapper {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        .search-input-container {
            position: relative;
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            font-size: clamp(20px, 4vw, 32px);
            color: var(--global-text);
            outline: none;
        }

        .search-hint {
            position: absolute;
            left: 0;
            font-size: clamp(20px, 4vw, 32px);
            color: var(--text-secondary);
            pointer-events: none;
            white-space: pre;
            opacity: 0.4;
        }

        .search-close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--global-text);
            cursor: pointer;
            padding: 0 10px;
        }

        .search-results {
            max-width: 700px;
            width: 100%;
            margin: 30px auto 0 auto;
            overflow-y: auto;
            flex-grow: 1;
            padding-bottom: 40px;
        }

        .search-result-item {
            display: block;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            color: inherit;
            transition: opacity 0.2s;
        }

        .search-result-item:hover {
            opacity: 0.7;
        }

        .search-result-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--global-text);
            margin-bottom: 6px;
        }

        .search-result-snippet {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .search-empty {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 40px;
            font-size: 16px;
        }

        /* Full-width wrappers for header and footer */
        #header, #footer {
            width: 100%;
            overflow-x: hidden;
        }

        /* Fluid and Responsive Page Container Layout */
        #page-container {
            width: 100%;
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h1.page-title {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 800;
            line-height: 1.25;
            margin: 0 0 30px 0;
            letter-spacing: -0.02em;
            word-break: break-word;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        /* Categories Grid Layout */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .category-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .category-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .category-card-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            color: var(--global-text);
            text-transform: capitalize;
        }

        .category-card-count {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .status-message {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 40px;
            font-size: 16px;
            grid-column: 1 / -1;
        }

        /* Desktop Breakpoint Enhancements */
        @media (min-width: 640px) {
            #page-container {
                margin: 70px auto;
                padding: 0 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Overlay Layer for Mobile Slide-in Menu -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Search Overlay Modal Component -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-wrapper">
            <div class="search-input-container">
                <div class="search-hint" id="searchHint"></div>
                <input type="text" class="search-input" id="searchInput" placeholder="Type to search pages..." autocomplete="off">
                <button class="search-close-btn" id="searchClose">&times;</button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <!-- Header section target (full width & responsive) -->
    <div id="header"></div>

    <!-- Page container for category collection -->
    <main id="page-container">
        <h1 class="page-title">Explore Categories</h1>
        <div class="categories-grid" id="categoriesGrid">
            <p class="status-message">Scanning categories...</p>
        </div>
    </main>

    <!-- Footer section target (full width & responsive) -->
    <div id="footer"></div>

    <script>
        // 1. Theme Orchestration Engine
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            const inputs = document.querySelectorAll('#themeToggle, #themeToggleMobile');
            inputs.forEach(input => input.checked = (theme === 'dark'));
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);

        function closeMenu() {
            document.body.classList.remove('menu-active');
            const burgerBtn = document.getElementById('hamburger');
            if (burgerBtn) burgerBtn.setAttribute('aria-expanded', 'false');
        }

        // 🔍 INDEXED SUB-PAGE SEARCH STORAGE ENGINE
        let searchDatabase = [];
        const pagesToSearch = [
            'about-us.html', 
            'privacy-policy.html', 
            'terms.html',
            'welcome-post.html'
        ];

        async function buildSearchIndex() {
            if (searchDatabase.length > 0) return;
            
            const promises = pagesToSearch.map(async (file) => {
                try {
                    const rawHtml = await fetch(`/sections/pages/${file}`).then(r => r.text());
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(rawHtml, 'text/html');
                    const cleanText = (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
                    const cleanTitle = file.replace('.html', '')
                                             .split('-')
                                             .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                                             .join(' ');

                    return {
                        filename: file,
                        title: cleanTitle,
                        text: cleanText,
                        words: cleanText.toLowerCase().split(/\W+/).filter(Boolean)
                    };
                } catch (e) {
                    console.error("Could not index sub-page for search:", file, e);
                    return null;
                }
            });

            searchDatabase = (await Promise.all(promises)).filter(Boolean);
        }

        function openSearch() {
            closeMenu();
            const overlay = document.getElementById('searchOverlay');
            if (overlay) {
                overlay.classList.add('active');
                const input = document.getElementById('searchInput');
                if (input) {
                    input.value = '';
                    input.focus();
                }
                document.getElementById('searchHint').textContent = '';
                document.getElementById('searchResults').innerHTML = '';
                buildSearchIndex();
            }
        }

        function closeSearch() {
            const overlay = document.getElementById('searchOverlay');
            if (overlay) overlay.classList.remove('active');
        }

        // 2. Global Event Listeners
        document.addEventListener('change', (e) => {
            if (e.target && (e.target.id === 'themeToggle' || e.target.id === 'themeToggleMobile')) {
                applyTheme(e.target.checked ? 'dark' : 'light');
            }
        });

        document.addEventListener('click', (e) => {
            const hamburger = e.target.closest('#hamburger');
            if (hamburger) {
                document.body.classList.toggle('menu-active');
                const isOpen = document.body.classList.contains('menu-active');
                hamburger.setAttribute('aria-expanded', isOpen);
                return;
            }

            if (e.target.id === 'menuOverlay' || e.target.closest('#drawerClose')) {
                closeMenu();
                return;
            }

            if (e.target.closest('.mobile-drawer .nav-link')) {
                closeMenu();
                return;
            }

            if (e.target.closest('.search-trigger')) {
                openSearch();
                return;
            }

            if (e.target.id === 'searchOverlay' || e.target.closest('#searchClose')) {
                closeSearch();
                return;
            }
        });

        // Live Input Search Processing Pipeline
        document.addEventListener('input', (e) => {
            if (e.target && e.target.id === 'searchInput') {
                const query = e.target.value.toLowerCase().trim();
                const hintLayer = document.getElementById('searchHint');
                const resultsLayer = document.getElementById('searchResults');

                if (!query) {
                    hintLayer.textContent = '';
                    resultsLayer.innerHTML = '';
                    return;
                }

                let bestHint = '';
                let matchHtml = '';
                let matchCount = 0;

                searchDatabase.forEach(item => {
                    const indexIdx = item.text.toLowerCase().indexOf(query);
                    
                    if (indexIdx !== -1) {
                        matchCount++;
                        
                        if (!bestHint) {
                            const matchingWord = item.words.find(w => w.startsWith(query));
                            if (matchingWord && matchingWord !== query) {
                                bestHint = e.target.value + matchingWord.slice(query.length);
                            }
                        }

                        const start = Math.max(0, indexIdx - 30);
                        const end = Math.min(item.text.length, indexIdx + 80);
                        let snippet = item.text.slice(start, end);
                        if (start > 0) snippet = '...' + snippet;
                        if (end < item.text.length) snippet = snippet + '...';

                        const safeSnippet = snippet.replace(new RegExp(query, 'gi'), match => `<strong>${match}</strong>`);

                        matchHtml += `
                            <a href="/sections/pages/${item.filename}" class="search-result-item" onclick="closeSearch()">
                                <div class="search-result-title">${item.title}</div>
                                <div class="search-result-snippet">${safeSnippet}</div>
                            </a>
                        `;
                    }
                });

                hintLayer.textContent = bestHint;
                
                if (matchCount > 0) {
                    resultsLayer.innerHTML = matchHtml;
                } else {
                    resultsLayer.innerHTML = `<div class="search-empty">No results found inside pages matching "${e.target.value}"</div>`;
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            const searchInput = document.getElementById('searchInput');
            const searchOverlay = document.getElementById('searchOverlay');
            if (!searchInput || !searchOverlay || !searchOverlay.classList.contains('active')) return;

            if (e.key === 'Escape') {
                closeSearch();
            }
            
            if (e.key === 'Tab') {
                const hintLayer = document.getElementById('searchHint');
                if (hintLayer && hintLayer.textContent) {
                    e.preventDefault();
                    searchInput.value = hintLayer.textContent;
                    hintLayer.textContent = '';
                }
            }
        });

        // 3. Dynamic Section Loader matching your project structure
        async function loadSection(elementId, file) {
            try {
                const pathParts = window.location.pathname.split('/').filter(Boolean);
                pathParts.pop(); // Remove current filename
                const basePath = pathParts.length > 0 ? '/' + pathParts.join('/') + '/' : '/';
                const fetchUrl = `${basePath}sections/${file}`.replace(/\/+/g, '/');

                const response = await fetch(fetchUrl);
                if (response.ok) {
                    const htmlText = await response.text();
                    const target = document.getElementById(elementId);
                    target.innerHTML = htmlText;

                    if (elementId === 'header') {
                        const activeTheme = document.documentElement.getAttribute('data-theme');
                        const inputs = target.querySelectorAll('#themeToggle, #themeToggleMobile');
                        inputs.forEach(input => input.checked = (activeTheme === 'dark'));
                    }
                }
            } catch (e) {
                console.log(`Could not load section: sections/${file}`);
            }
        }

        // 4. Front-Matter Parsing & Category Collection Aggregator
        function extractFrontMatter(markdownText) {
            const frontMatter = {};
            const lines = markdownText.split('\n');
            
            if (lines[0].trim() !== '---') return frontMatter;

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line === '---') break;
                const colonIndex = line.indexOf(':');
                if (colonIndex !== -1) {
                    const key = line.slice(0, colonIndex).trim();
                    let value = line.slice(colonIndex + 1).trim();
                    value = value.replace(/^['"](.*)['"]$/, '$1');
                    frontMatter[key] = value;
                }
            }

            return frontMatter;
        }

        function generateCategoryCards(categoryMap, containerElement) {
            if (Object.keys(categoryMap).length === 0) {
                containerElement.innerHTML = '<p class="status-message">No categories found.</p>';
                return;
            }

            // Sort categories alphabetically
            const sortedCategories = Object.keys(categoryMap).sort();

            const html = sortedCategories.map(category => {
                const count = categoryMap[category];
                const categoryUrl = `category.html?name=${encodeURIComponent(category)}`;
                const postText = count === 1 ? '1 post' : `${count} posts`;

                return `
                    <a href="${categoryUrl}" class="category-card">
                        <h2 class="category-card-title">${category}</h2>
                        <span class="category-card-count">${postText}</span>
                    </a>
                `;
            }).join('');

            containerElement.innerHTML = html;
        }

        async function initCategoryCollectionPage() {
            loadSection('header', 'header.html');
            loadSection('footer', 'footer.html');

            const gridElement = document.getElementById('categoriesGrid');

            try {
                const pathParts = window.location.pathname.split('/').filter(Boolean);
                pathParts.pop();
                const basePath = pathParts.length > 0 ? '/' + pathParts.join('/') + '/' : '/';
                
                const indexUrl = `${basePath}posts/index.md`.replace(/\/+/g, '/');
                const indexResponse = await fetch(indexUrl);
                if (!indexResponse.ok) throw new Error('Could not load /posts/index.md');
                const indexText = await indexResponse.text();

                const postFilenames = indexText
                    .split('\n')
                    .map(line => line.trim())
                    .filter(line => line && !line.startsWith('#'));

                if (postFilenames.length === 0) {
                    gridElement.innerHTML = '<p class="status-message">No posts listed in index.md.</p>';
                    return;
                }

                const postPromises = postFilenames.map(async (filename) => {
                    try {
                        const postUrl = `${basePath}posts/${filename}`.replace(/\/+/g, '/');
                        const response = await fetch(postUrl);
                        if (!response.ok) return null;
                        const text = await response.text();
                        return extractFrontMatter(text);
                    } catch (err) {
                        return null;
                    }
                });

                const allPosts = (await Promise.all(postPromises)).filter(Boolean);
                
                // Aggregate categories and count posts per category
                const categoryMap = {};
                allPosts.forEach(post => {
                    if (post.category) {
                        const catClean = post.category.trim();
                        categoryMap[catClean] = (categoryMap[catClean] || 0) + 1;
                    }
                });

                generateCategoryCards(categoryMap, gridElement);

            } catch (error) {
                gridElement.innerHTML = '<p class="status-message">Failed to load categories collection.</p>';
            }
        }

        initCategoryCollectionPage();
    </script>
</body>
</html>
